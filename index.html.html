<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Learning Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: ribbon | file explorer | tabbed note pane | properties & links panel. Obsidian-like workspace, tuned for studying. */
:root{
  --bg:#ffffff;
  --bg-2:#f4f4f4;
  --bg-3:#e9e9e9;
  --hover:rgba(0,0,0,.05);
  --border:#dedede;
  --text:#222222;
  --muted:#666666;
  --faint:#999999;
  --accent:#3a3a3a;
  --accent-soft:rgba(0,0,0,.07);
  --link:#2f5f8a;
  --code-bg:#f0f0f0;
  --s-new:#d4705f;
  --s-learn:#c98a14;
  --s-done:#2f9e6a;
  --danger:#c93c3c;
  --g1:#6f4fd8;--g2:#d0632b;--g3:#2f8fb3;--g4:#2f9e6a;--g5:#c0418a;--g6:#a37a1e;
  --shadow:0 8px 30px rgba(20,10,40,.14);
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1c;--bg-2:#232323;--bg-3:#161616;--hover:rgba(255,255,255,.06);--border:#323232;
    --text:#dddddd;--muted:#a3a3a3;--faint:#6e6e6e;--accent:#cfcfcf;--accent-soft:rgba(255,255,255,.09);
    --link:#9fb6cc;--code-bg:#2a2a2a;--s-new:#d06a5c;--s-learn:#e0a335;--s-done:#4cc38a;--danger:#ef6b6b;
    --g1:#9a7bff;--g2:#f08a4b;--g3:#4fb4d8;--g4:#4cc38a;--g5:#e06aae;--g6:#d9b25a;
    --shadow:0 10px 36px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1c1c;--bg-2:#232323;--bg-3:#161616;--hover:rgba(255,255,255,.06);--border:#323232;
  --text:#dddddd;--muted:#a3a3a3;--faint:#6e6e6e;--accent:#cfcfcf;--accent-soft:rgba(255,255,255,.09);
  --link:#9fb6cc;--code-bg:#2a2a2a;--s-new:#d06a5c;--s-learn:#e0a335;--s-done:#4cc38a;--danger:#ef6b6b;
  --g1:#9a7bff;--g2:#f08a4b;--g3:#4fb4d8;--g4:#4cc38a;--g5:#e06aae;--g6:#d9b25a;
  --shadow:0 10px 36px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}

.app{display:grid;grid-template-columns:44px auto minmax(0,1fr) auto;height:100%}
.ribbon{grid-column:1;grid-row:1}.sidebar.left{grid-column:2;grid-row:1}.main{grid-column:3;grid-row:1}.sidebar.right{grid-column:4;grid-row:1}
.ribbon{background:var(--bg-3);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.ribbon .sp{flex:1}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.on{color:var(--accent)}

.sidebar{width:272px;background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0}
.sidebar.right{border-right:0;border-left:1px solid var(--border);width:280px}
.sidebar[hidden],.sidebar.right.on-home{display:none}
.side-head{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);min-height:40px}
.side-head .title{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:6px;flex:1}
.side-body{flex:1;overflow:auto;padding:6px 6px 12px;min-height:0}

/* tree */
.tree-folder>.row,.tree-note{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;cursor:pointer;color:var(--muted);user-select:none;min-height:26px}
.tree-folder>.row:hover,.tree-note:hover{background:var(--hover);color:var(--text)}
.tree-note.active{background:var(--accent-soft);color:var(--text)}
.tree-folder>.row{color:var(--text);font-weight:500}
.tree-folder .chev{transition:transform .15s;color:var(--faint)}
.tree-folder.open>.row .chev{transform:rotate(90deg)}
.tree-children{margin-left:15px;border-left:1px solid var(--border);padding-left:4px}
.tree-folder:not(.open)>.tree-children{display:none}
.tree-note .name,.tree-folder .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s-new)}
.dot.learning{background:var(--s-learn)}
.dot.new{opacity:.8}
.dot.mastered{background:var(--s-done)}
.ext{font:500 10px/1 var(--font-mono);padding:3px 4px;border-radius:3px;background:var(--bg-3);color:var(--muted);text-transform:uppercase}
.prog{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:400}
.drop-target{background:var(--accent-soft)!important;outline:1px dashed var(--accent)}
.vault-foot{border-top:1px solid var(--border);padding:10px 14px;display:grid;gap:6px}
.vault-foot .vn{font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.vault-foot .vn span{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--bg-3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--s-done)}.bar .b-learn{background:var(--s-learn)}

/* search */
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;margin:4px 2px 8px}
.search-box input{border:0;outline:0;background:none;flex:1;min-width:0}
.result{padding:6px 8px;border-radius:5px;cursor:pointer}
.result:hover{background:var(--hover)}
.result .rt{font-weight:500}
.result .rs{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.result mark{background:var(--accent-soft);color:var(--text);border-radius:2px}
.empty-note{color:var(--faint);font-size:13px;padding:8px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.tabbar{height:40px;background:var(--bg-2);display:flex;align-items:flex-end;padding:0 6px;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;flex:none;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:7px 7px 0 0;max-width:200px;min-width:90px;color:var(--muted);cursor:pointer;flex:none;position:relative}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--border);clip-path:inset(-1px -1px 0 -1px)}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;opacity:.6}
.tab .x:hover{background:var(--hover);opacity:1}
.tab-add{height:32px;width:32px;display:grid;place-items:center;color:var(--muted);border-radius:6px;flex:none}
.tab-add:hover{background:var(--hover)}
.view-header{height:42px;display:flex;align-items:center;padding:0 10px 0 18px;gap:6px;flex:none}
.crumbs{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted)}
.pill:hover{border-color:var(--faint);color:var(--text)}
.pill.learning{color:var(--s-learn);border-color:color-mix(in srgb,var(--s-learn) 45%,transparent)}
.pill.mastered{color:var(--s-done);border-color:color-mix(in srgb,var(--s-done) 45%,transparent)}
.view-content{flex:1;overflow:auto;position:relative;min-height:0}
.doc{max-width:740px;margin:0 auto;padding:12px 36px 140px;position:relative}
.inline-title{display:block;width:100%;border:0;outline:0;background:none;font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.01em;padding:0;margin:8px 0 14px;text-wrap:balance}
.editor{display:block;width:100%;border:0;outline:0;resize:none;background:none;font:15.5px/1.7 var(--font-ui);color:var(--text);min-height:60vh;overflow:hidden;padding:0;tab-size:4}

/* rendered markdown */
.md{font-size:15.5px;line-height:1.7}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;text-wrap:balance;margin:1.6em 0 .5em}
.md h1{font-size:1.6em}.md h2{font-size:1.32em}.md h3{font-size:1.12em}.md h4{font-size:1em}
.md p{margin:.6em 0}
.md a{color:var(--link);text-decoration:none}
.md a:hover{text-decoration:underline}
.md a.unresolved{opacity:.6;text-decoration:underline dotted}
.md a.tag{background:var(--accent-soft);padding:1px 7px;border-radius:10px;font-size:.88em}
.md code{font:.86em var(--font-mono);background:var(--code-bg);padding:1px 5px;border-radius:4px}
.md pre{background:var(--code-bg);padding:12px 14px;border-radius:7px;overflow-x:auto;line-height:1.55}
.md pre code{background:none;padding:0;font-size:13px}
.md blockquote{margin:.8em 0;padding:2px 0 2px 16px;border-left:3px solid var(--accent);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:1.6em 0}
.md ul,.md ol{padding-left:1.5em;margin:.5em 0}
.md li{margin:.15em 0}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task input{margin:0 8px 0 0;vertical-align:-2px;accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.md li.task.done{color:var(--faint);text-decoration:line-through}
.md mark{background:color-mix(in srgb,var(--s-learn) 30%,transparent);color:inherit;padding:0 2px;border-radius:2px}
.md img{max-width:100%;border-radius:6px}
.table-wrap{overflow-x:auto;margin:.8em 0}
.md table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--border);padding:6px 12px;text-align:left}
.md th{background:var(--bg-2);font-weight:600}
.callout{--c:var(--g3);margin:1em 0;border-radius:7px;padding:10px 14px;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:3px solid var(--c)}
.callout[data-callout="tip"],.callout[data-callout="success"]{--c:var(--g4)}
.callout[data-callout="warning"],.callout[data-callout="caution"]{--c:var(--g2)}
.callout[data-callout="example"]{--c:var(--g1)}
.callout[data-callout="question"]{--c:var(--g5)}
.callout-title{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--c)}
.callout-content>*:last-child{margin-bottom:0}
.callout-content>*:first-child{margin-top:.3em}
.props{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;padding:10px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.props dt{color:var(--muted)}.props dd{margin:0}
.embed-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}

/* file view */
.file-view{padding:24px;display:grid;gap:14px;justify-items:center}
.file-view img,.file-view video{max-width:100%;max-height:75vh;border-radius:8px}
.file-view iframe{width:100%;height:78vh;border:1px solid var(--border);border-radius:8px;background:#fff}
.file-meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.file-meta a{color:var(--link)}
.file-text{width:100%;max-width:900px;background:var(--code-bg);border-radius:8px;padding:14px;font:13px/1.55 var(--font-mono);white-space:pre-wrap;overflow:auto;max-height:75vh}

/* empty state */
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:20px;margin:0 0 14px}
.empty .acts{display:grid;gap:6px}
.empty .acts button{color:var(--link)}
.empty .acts button:hover{text-decoration:underline}
.empty kbd,.kbd{font:11px var(--font-mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted)}

/* right panel */
.panel-sec{padding:10px 8px 6px}
.panel-sec+.panel-sec{border-top:1px solid var(--border)}
.panel-sec h4{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.panel-sec h4 span{font-variant-numeric:tabular-nums;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{padding:6px 4px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text);font-weight:500}
.link-item{display:block;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--text);font-size:13px}
.link-item:hover{background:var(--hover)}
.link-item small{display:block;color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-item.unres{color:var(--faint)}
.outline-item{display:block;padding:3px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline-item:hover{background:var(--hover);color:var(--text)}
.track-btn{width:100%;padding:7px;border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-size:12.5px}
.track-btn:hover{border-color:var(--accent);color:var(--text)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:12.5px;margin-top:10px}
.kv dt{color:var(--faint)}.kv dd{margin:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.statusbar{position:absolute;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:4px 12px;font-size:12px;color:var(--muted);background:var(--bg-2);border:1px solid var(--border);border-right:0;border-bottom:0;border-top-left-radius:8px;font-variant-numeric:tabular-nums;z-index:5}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--s-done)}.sync.warn i{background:var(--s-learn)}.sync.bad i{background:var(--danger)}

/* graph */
.graph-wrap{position:absolute;inset:0}
.graph-wrap canvas{display:block;width:100%;height:100%;cursor:grab}
.graph-wrap canvas.dragging{cursor:grabbing}
.graph-legend{position:absolute;left:14px;top:12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;display:grid;gap:4px;color:var(--muted)}
.graph-legend div{display:flex;align-items:center;gap:8px}
.graph-legend i{width:9px;height:9px;border-radius:50%}
.graph-hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--faint)}

/* home */
.home-wrap{position:relative;min-height:100%}
.home{max-width:1140px;margin:0 auto;padding:22px 36px 120px;display:grid;gap:30px}
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:radial-gradient(120% 140% at 85% 40%,var(--accent-soft),transparent 60%),var(--bg-2);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:40px 44px;min-height:360px;container-type:inline-size}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(canvas){position:relative;z-index:1}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display);font-size:clamp(40px,7.4cqi,78px);font-weight:800;line-height:.92;letter-spacing:-.035em;margin:14px 0 22px;text-wrap:balance;font-variation-settings:"opsz" 96}
.display em{font-style:normal;color:var(--accent)}
.next-card{display:grid;grid-template-columns:4px 1fr;gap:0 16px;max-width:520px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:14px;padding:16px 18px 16px 0;overflow:hidden}
.next-card .stripe{border-radius:0 3px 3px 0;background:var(--mc,var(--accent))}
.next-card .lbl{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.next-card h3{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 4px;line-height:1.1}
.next-card p{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:58ch}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:9px;background:var(--accent);color:var(--bg);font-weight:600}
.cta:hover{filter:brightness(1.08)}
.ghost{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.ghost:hover{border-color:var(--faint)}
.ring-box{display:grid;align-content:center;justify-items:center;gap:14px}
.ring{position:relative;width:200px;height:200px;border-radius:50%;background:color-mix(in srgb,var(--bg-2) 78%,transparent);backdrop-filter:blur(3px);box-shadow:0 0 0 18px color-mix(in srgb,var(--bg-2) 40%,transparent)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--font-display);font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.sec-h span{color:var(--muted);font-size:13px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{--mc:var(--accent);position:relative;text-align:left;border:1px solid var(--border);border-radius:16px;background:var(--bg-2);padding:18px 18px 16px;display:grid;gap:10px;transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden}
.mod::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--mc)}
.mod:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--mc) 55%,var(--border));box-shadow:var(--shadow)}
.mod .num{font:600 12px var(--font-mono);color:var(--mc)}
.mod h3{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.mod .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mod .next{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.mod .next b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod.add{border-style:dashed;background:none;place-content:center;justify-items:center;text-align:center;color:var(--muted);min-height:150px}
.mod.add::before{display:none}

> [!tip] My Learning Vault
> Every **module** from Moodle is a folder on the left, and every session or lecture inside it is a **concept** to learn. Open one, follow the purple links to related ideas, and mark your progress as you go.

## Modules
- [[Mathematics in Computing]]: 8 sessions, from set theory to graph theory
- [[Creative Coding]]: 16 topics, from Dear Data to 3D graphics
- [[Databases]]: 8 sessions, from ER modelling to SQL and security
- [[Programming in Java]]: lectures so far
- [[Systems Architecture]]: one note per week, added as you go

## How to use it
1. Open a module's overview note to see the sessions in Moodle order.
2. Read a session note, then work through its **Check yourself** list. Tick the boxes as you finish them.
3. Write your own lecture notes under **My notes** at the bottom of each session.
4. Set the status in the top-right: *Not started*, *Learning* or *Mastered*. The home page, the dots in the file tree and the module progress bars all follow it.
5. Open the **graph view** to see how ideas link across modules. Set theory shows up in databases, logic in Java, and matrices in 3D graphics.

## Bring your own material
- **Drag files in from your computer.** Drop them anywhere on the page, or onto a folder in the tree to put them there.
- `.md` and `.txt` files become notes you can edit. Lecture slides (PDF), images and anything else become attachments you can open from the tree.
- You can drop a whole folder and its structure is kept.
- Drop or paste a screenshot into a note while editing and it's embedded where your cursor is.

## Writing notes
- Link to any note with `[[Note name]]`. Typing `[[` suggests matches.
- Highlight with `==text==`, tag with `#revision`, and make a checklist with `- [ ]`.
- Callouts work like Obsidian: start a quote with `> [!tip]`, `> [!warning]` or `> [!example]`.

## Shortcuts
| Action | Keys |
| --- | --- |
| Quick switcher | Ctrl/Cmd + P or K |
| Toggle reading / editing | Ctrl/Cmd + E |
| Graph view | Ctrl/Cmd + G |
| New note | Alt + N |

@@ Mathematics in Computing/Set Theory
---
session: 1
module: Mathematics in Computing
---
A **set** is an unordered collection of distinct objects, called its *elements*.

## Writing sets
- **Roster:** `A = {1, 2, 3}`
- **Set-builder:** `B = { x ∈ ℤ | x > 0 }`, "the integers x such that x > 0"
- **Empty set:** `∅` or `{}`
- **Membership:** `x ∈ A` (is an element), `x ∉ A` (is not)

> [!tip] Order and repetition don't matter
> `{1, 2, 3} = {3, 1, 2} = {1, 1, 2, 3}`

## Subsets
- `A ⊆ B`: every element of A is in B. `A ⊂ B`: a subset and not equal.
- `∅ ⊆ A` and `A ⊆ A` for every set A.
- `A = B` exactly when `A ⊆ B` and `B ⊆ A`. This is how you prove two sets are equal.

## Power sets and cardinality
- `|A|` is the number of elements. `|∅| = 0`, `|{∅}| = 1`.
- The **power set** `P(A)` is the set of all subsets of A. If `|A| = n` then `|P(A)| = 2ⁿ`, because each element is either in or out.
- `P({a, b}) = { ∅, {a}, {b}, {a, b} }`

## Number sets
`ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ`: naturals, integers, rationals, reals. Check whether your module counts 0 as a natural number.

@@ Mathematics in Computing/Set Operations and Relations
---
session: 2
module: Mathematics in Computing
---
## Operations
| Operation | Notation | Contains |
| --- | --- | --- |
| Union | `A ∪ B` | in A or B (or both) |
| Intersection | `A ∩ B` | in both A and B |
| Difference | `A \ B` | in A but not B |
| Complement | `A′` | in the universal set U but not in A |
| Symmetric difference | `A △ B` | in exactly one of A, B |
| Cartesian product | `A × B` | ordered pairs `(a, b)` |

- **De Morgan:** `(A ∪ B)′ = A′ ∩ B′` and `(A ∩ B)′ = A′ ∪ B′`
- **Inclusion–exclusion:** `|A ∪ B| = |A| + |B| − |A ∩ B|`
- `|A × B| = |A| · |B|`

## Relations
A **relation** from A to B is any subset of `A × B`. A relation *on* A is a subset of `A × A`.

Properties of a relation on A:
- **Reflexive:** `a R a` for every a
- **Symmetric:** `a R b` means `b R a`
- **Antisymmetric:** `a R b` and `b R a` means `a = b`
- **Transitive:** `a R b` and `b R c` means `a R c`

An **equivalence relation** is reflexive, symmetric and transitive (e.g. "same remainder mod 3"). A **partial order** is reflexive, antisymmetric and transitive (e.g. `≤`, `⊆`).

> [!example] This is where databases get their name
> A table is a *relation*: a set of rows, each one a tuple from the Cartesian product of the columns' domains. See [[Relational Modelling]]. SQL even has `UNION`, `INTERSECT` and `EXCEPT` ([[SQL DML Reads]]).

## Check yourself

- [ ] Write out `{0,1} × {a,b}`
- [ ] Is "is a sibling of" reflexive? symmetric? transitive?

@@ Mathematics in Computing/Functions
---
session: 3
module: Mathematics in Computing
---
A **function** `f: A → B` pairs every element of A with *exactly one* element of B.

- **Domain** A, **codomain** B, **range** (image) = the outputs actually reached
- **Injective** (one-to-one): different inputs give different outputs
- **Surjective** (onto): every element of B is hit
- **Bijective**: both. Only bijections have an **inverse** `f⁻¹`.
- **Composition:** `(g ∘ f)(x) = g(f(x))`, apply f first

> [!tip] Link to code
> A Java method that only depends on its parameters and changes nothing else behaves like a maths function. See [[Methods]].

## Check yourself

@@ Mathematics in Computing/Propositional Logic
---
session: 4
module: Mathematics in Computing
---
A **proposition** is a statement that is either true or false.

| Symbol | Name | Java |
| --- | --- | --- |
| `¬p` | not | `!p` |
| `p ∧ q` | and | `p && q` |
| `p ∨ q` | or | `p \|\| q` |
| `p ⊕ q` | exclusive or | `p ^ q` |

## Truth tables
List every combination of truth values (2ⁿ rows for n variables) and work out the result column by column.

```
p  q | p ∧ q | p ∨ q
T  T |   T   |   T
T  F |   F   |   T
F  T |   F   |   T
F  F |   F   |   F
```

## Key terms
- **Tautology:** always true, e.g. `p ∨ ¬p`
- **Contradiction:** always false, e.g. `p ∧ ¬p`
- **Logically equivalent (≡):** same truth table
- **De Morgan:** `¬(p ∧ q) ≡ ¬p ∨ ¬q` and `¬(p ∨ q) ≡ ¬p ∧ ¬q`

> [!example] In your code
> `if (!(age >= 18 && hasTicket))` is the same as `if (age < 18 || !hasTicket)`. See [[Decisions]] and [[Operators and Conditional Statements]].

## Check yourself
- [ ] Build the truth table for `¬(p ∨ q)` and `¬p ∧ ¬q` and check they match
- [ ] Is `(p ∧ q) → p` a tautology?
- [ ] Simplify `!(x > 5 || y < 2)` in Java

@@ Mathematics in Computing/Logical Implication and Predicate Logic
---
session: 5
module: Mathematics in Computing
---
## Implication
`p → q` ("if p then q") is only false when p is true and q is false.

```
p  q | p → q | p ↔ q
T  T |   T   |   T
T  F |   F   |   F
F  T |   T   |   F
F  F |   T   |   T
```

For `p → q`:
- **Converse:** `q → p` (not equivalent)
- **Inverse:** `¬p → ¬q` (not equivalent)
- **Contrapositive:** `¬q → ¬p` (equivalent, and often easier to prove)
- `p → q ≡ ¬p ∨ q`

## Predicate logic
A **predicate** is a statement with variables, like `P(x): x > 3`. It becomes a proposition once x has a value or is quantified.
- **Universal:** `∀x P(x)`, "for every x, P(x)"
- **Existential:** `∃x P(x)`, "there is at least one x with P(x)"
- **Negation:** `¬∀x P(x) ≡ ∃x ¬P(x)` and `¬∃x P(x) ≡ ∀x ¬P(x)`

> [!example] Databases use predicates
> `WHERE price > 10 AND stock > 0` is a predicate tested on every row. See [[SQL DML Reads]].

## Check yourself
- [ ] Write the converse, inverse and contrapositive of "if it rains, the match is cancelled"
- [ ] Negate "every student passed" using quantifiers
- [ ] Translate "some number is greater than every other number" into symbols

@@ Mathematics in Computing/Vectors and Matrices
---
session: 6
module: Mathematics in Computing
---
## Vectors
A vector has size and direction, written as components like `v = (3, 4)`.
- **Add:** `(1, 2) + (3, 4) = (4, 6)`
- **Scale:** `2 · (1, 2) = (2, 4)`
- **Magnitude:** `|v| = √(3² + 4²) = 5`
- **Dot product:** `(a₁, a₂) · (b₁, b₂) = a₁b₁ + a₂b₂`. It's 0 when the vectors are perpendicular.

## Matrices
A grid of numbers with m rows and n columns (an m × n matrix).
- **Add:** same size only, add entry by entry
- **Multiply** `A × B`: only when A's column count equals B's row count. Entry (i, j) is row i of A dotted with column j of B. An m × n times an n × p gives m × p.
- **Order matters:** `AB` is usually not `BA`
- **Identity** `I`: 1s on the diagonal, so `AI = A`
- **Transpose** `Aᵀ`: swap rows and columns

> [!example] In graphics
> Moving, rotating and scaling shapes are matrix multiplications. Processing does this for you in [[3D Graphics]] with `translate()` and `rotate()`. A graph can also be stored as an adjacency matrix ([[Graph Theory]]).

## Check yourself

- [ ] Multiply `[[1, 2], [3, 4]]` by `[[0, 1], [1, 0]]`, then the other way round
- [ ] Can you multiply a 2 × 3 matrix by a 2 × 3 matrix? Why not?

@@ Mathematics in Computing/Probability
---
session: 7
module: Mathematics in Computing
---
- **Sample space S:** every possible outcome. Rolling a die: `S = {1, 2, 3, 4, 5, 6}`
- **Event:** a subset of S, e.g. "even" = `{2, 4, 6}`
- With equally likely outcomes, `P(E) = |E| / |S|`

## Rules
- `0 ≤ P(E) ≤ 1`
- **Complement:** `P(E′) = 1 − P(E)`
- **Union:** `P(A ∪ B) = P(A) + P(B) − P(A ∩ B)` (inclusion–exclusion again, from [[Set Operations and Relations]])
- **Independent events:** `P(A ∩ B) = P(A) · P(B)`
- **Conditional:** `P(A | B) = P(A ∩ B) / P(B)`, the chance of A given B has happened

> [!tip]
> "At least one" questions are usually easiest as `1 − P(none)`.

> [!example] In your code
> `random()` in [[Art]] and generative sketches is probability in action.

## Check yourself
- [ ] Two dice are rolled. What's the probability the total is 7?
- [ ] A coin is flipped 3 times. What's P(at least one head)?
- [ ] If `P(A) = 0.5`, `P(B) = 0.4` and `P(A ∩ B) = 0.2`, are A and B independent?

@@ Mathematics in Computing/Graph Theory
---
session: 8
module: Mathematics in Computing
---
A **graph** `G = (V, E)` is a set of vertices V and a set of edges E joining pairs of them.

## Key terms
- **Degree:** the number of edges at a vertex
- **Handshake lemma:** the degrees add up to `2|E|`, so the number of odd-degree vertices is always even
- **Path:** a route along edges. **Cycle:** a path that returns to its start.
- **Connected:** there's a path between every pair of vertices
- **Tree:** connected with no cycles. A tree with n vertices has exactly `n − 1` edges.
- **Directed graph:** edges have a direction (a relation on V, see [[Set Operations and Relations]])
- **Weighted graph:** edges carry a cost, like distances

## Storing a graph
- **Adjacency matrix:** an n × n grid where entry (i, j) is 1 if there's an edge ([[Vectors and Matrices]])
- **Adjacency list:** for each vertex, a list of its neighbours. Better when there are few edges.

> [!tip]
> The graph view in this vault is a graph: notes are vertices and links are edges.

## Check yourself
- [ ] Can a graph have exactly three vertices of odd degree? Why not?
- [ ] Draw the adjacency matrix for a triangle a–b–c
- [ ] How many edges does a tree with 10 vertices have?

**Dear Data** was a year-long project by information designers Giorgia Lupi and Stefanie Posavec. Each week they collected data about one part of their lives, drew it by hand on a postcard, and posted it to the other. It later became a book.

## The idea
- Pick a small, personal topic (how often you check your phone, every drink you have, every time you laugh).
- Collect the data by hand for a week.
- Invent a visual language: shapes, colours and positions that each mean something.
- Draw it, and add a **legend** on the back so someone else can read it.

> [!tip] Why a coding module starts with pen and paper
> Deciding how data becomes marks is the hard part of [[Data Visualization]]. Code just makes it faster. You come back to this at the end in [[Dear Data Denouement]].

@@ Creative Coding/Sketches
---
topic: 2
module: Creative Coding

In Processing a program is called a **sketch**. Most sketches have two parts:

```java
void setup() {          // runs once at the start
  size(400, 400);       // window width and height
}

void draw() {           // runs again and again, about 60 times a second
  background(240);
  fill(255, 0, 0);
  ellipse(200, 200, 80, 80);   // x, y, width, height
}
```

## Coordinates
- `(0, 0)` is the **top-left** corner.
- x grows to the right; **y grows downwards**.

## Drawing basics
- Shapes: `point`, `line`, `rect`, `ellipse`, `triangle`
- Colour: `fill()` for inside, `stroke()` for outline, `noFill()`, `noStroke()`
- Colours are 0–255 per channel: `fill(r, g, b)` or one number for grey

## Check yourself
- [ ] Draw a face using only ellipses and rects
- [ ] What happens if you move `background()` into `setup()`?
- [ ] Draw a line from the top-left corner to the bottom-right corner, whatever the window size

A **variable** is a named box holding a value. In Java every variable has a **type**.

```java
int count = 0;          // whole numbers
float x = 12.5;         // decimals
boolean on = true;      // true / false
String name = "Ada";    // text
color c = color(255, 120, 0);   // Processing colour
```

## Built-in variables
`width`, `height`, `mouseX`, `mouseY`, `frameCount`, `key`

## Scope
- Declared at the top of the sketch: **global**, visible everywhere and kept between frames.
- Declared inside `draw()` or a method: **local**, reset every time it runs.

> [!warning] Integer division
> `int a = 7 / 2;` gives `3`, not `3.5`. Use `7 / 2.0` or a `float` if you need the decimal.

@@ Creative Coding/Methods

topic: 4 (second part)

A **method** is a named, reusable block of code. `setup()` and `draw()` are methods you've been writing all along.

```java
void drawFlower(float x, float y, float size) {   // parameters
  fill(255, 200, 0);
  ellipse(x, y, size, size);
}

float area(float r) {            // returns a value
  return PI * r * r;
}
```

- `void` means the method returns nothing.
- Any other type (`float`, `int`, `boolean`…) means it must `return` a value of that type.
- **Parameters** are the inputs. **Arguments** are the values you pass in: `drawFlower(100, 100, 40)`.

> [!tip]
> A method that only uses its parameters and returns a result is like a maths function. See [[Functions]].

@@ Creative Coding/Loops and Groups

## Loops
```java
for (int i = 0; i < 10; i++) {
  ellipse(20 + i * 40, height / 2, 30, 30);   // a row of 10 circles
}
```
- Nested loops make grids: an outer loop for rows, an inner one for columns.
- `while (condition)` repeats until the condition is false.

## Groups (arrays)
An **array** holds many values of one type under one name.

```java
float[] xs = new float[50];
for (int i = 0; i < xs.length; i++) xs[i] = random(width);
```
- Indexes start at **0**, so the last one is `length − 1`.
- `ArrayList<Type>` is a group that can grow and shrink.

> [!warning]
> Don't put an endless `while` loop inside `draw()`: the screen never updates.

@@ Creative Coding/Classes and Objects
---
topic: 7
module: Creative Coding
---
A **class** is a blueprint. An **object** is one thing made from it.

```java
class Ball {
  float x, y, speed;                 // fields: what each ball knows

  Ball(float x, float y) {           // constructor: how to make one
    this.x = x; this.y = y; speed = random(1, 4);
  }

  void move() { y += speed; if (y > height) y = 0; }   // methods: what it can do
  void show() { ellipse(x, y, 20, 20); }
}

Ball[] balls = new Ball[30];
```

- Create objects with `new`: `balls[i] = new Ball(random(width), 0);`
- Each object has its own copy of the fields.
- `this.x` means "this object's x", useful when a parameter has the same name.

**Generative art** sets up rules and lets the program make the picture, often with randomness.

- `random(a, b)`: a different number every call
- `noise(x)`: Perlin noise, random but smooth, so it looks natural (hills, clouds, wobbly lines)
- `randomSeed(n)` / `noiseSeed(n)`: the same "random" output every run, so you can recreate a piece
- Repetition plus small variation is the core trick

```java
for (int i = 0; i < 500; i++) {
  stroke(random(255), 100, 200, 60);
  line(width / 2, height / 2, random(width), random(height));
}
```

> [!tip]
> `random()` is [[Probability]] made visible: every value in the range is equally likely.

}
```

- **z axis:** positive z comes towards the viewer.
- **Transformations:** `translate`, `rotateX/Y/Z`, `scale`. They stack up, so order matters.
- `pushMatrix()` / `popMatrix()` save and restore the current position so one object's moves don't affect the next.
- Shapes: `box`, `sphere`, or your own with `beginShape()` and `vertex(x, y, z)`.
- `camera()` and `perspective()` control the view.

> [!example] It's all matrices
> Every translate and rotate is a matrix multiplication, which is why order matters. See [[Vectors and Matrices]].

@@ Databases/Introduction to Databases
---
session: 1
week: 3
module: Databases
---
A **database** is an organised collection of related data. A **database management system (DBMS)** is the software that stores it and lets people use it safely, such as MySQL, PostgreSQL, Oracle or SQL Server.

## Why not just use files?
Storing data in separate files leads to:
- **Redundancy:** the same data copied in several places
- **Inconsistency:** the copies drift apart
- **No integrity rules:** nothing stops bad data getting in
- **Concurrency problems:** two people editing at once
- **Poor security and recovery**

A DBMS solves these centrally.

## Key terms
- **Data vs information:** raw facts vs facts with meaning
- **Schema:** the structure (tables, columns, types). **Instance:** the data in it right now.
- **Relational database:** data in tables linked by keys
- **SQL:** the language used to define and query relational databases

@@ Databases/ER Modelling
---
session: 2
week: 4
module: Databases

An **entity–relationship (ER) model** is a diagram of the data before you build any tables.

## Parts
- **Entity:** a thing you store data about (Student, Module)
- **Attribute:** a property of it (name, email)
  - **Key attribute:** identifies each one uniquely (studentID)
  - **Composite:** made of parts (address → street, city, postcode)
  - **Multivalued:** can have several values (phone numbers)
  - **Derived:** worked out from others (age from date of birth)
- **Relationship:** how entities connect (Student *enrols on* Module)

## Cardinality
- **1:1** one person has one passport
- **1:N** one lecturer teaches many modules
- **M:N** many students take many modules
- **Participation:** must every entity take part (mandatory) or not (optional)?

Diagrams are often drawn in **crow's foot** notation, where the "foot" marks the many side.

@@ Databases/Relational Modelling
---
session: 3
week: 5
module: Databases
---
The **relational model** stores data in **relations** (tables). The name comes straight from maths: a relation is a set of tuples ([[Set Operations and Relations]]).

| Term | Everyday name |
| --- | --- |
| Relation | table |
| Tuple | row |
| Attribute | column |
| Domain | the allowed values for a column |

## Keys
- **Candidate key:** any minimal set of columns that identifies a row uniquely
- **Primary key:** the candidate key you choose
- **Foreign key:** a column that refers to another table's primary key, which is how tables link
- **Composite key:** a key made of more than one column

## From ER diagram to tables
- Each entity becomes a table.
- **1:N:** put the "1" side's primary key as a foreign key in the "N" side.
- **M:N:** make a new **junction table** holding both primary keys (e.g. `Enrolment(studentID, moduleCode)`).

@@ Databases/SQL DDL - Creating Tables and Data
---
session: 4
week: 7

**DDL (Data Definition Language)** is the part of SQL that creates and changes structure.

```sql
CREATE TABLE Student (
  studentID   INT PRIMARY KEY,
  name        VARCHAR(100) NOT NULL,
  email       VARCHAR(100) UNIQUE,
  yearOfStudy INT CHECK (yearOfStudy BETWEEN 1 AND 4)
);

CREATE TABLE Enrolment (
  studentID  INT,
  moduleCode VARCHAR(10),
  PRIMARY KEY (studentID, moduleCode),
  FOREIGN KEY (studentID) REFERENCES Student(studentID)
);
```

## Constraints
`PRIMARY KEY`, `FOREIGN KEY … REFERENCES`, `NOT NULL`, `UNIQUE`, `CHECK`, `DEFAULT`

## Changing structure
- `ALTER TABLE Student ADD phone VARCHAR(20);`
- `DROP TABLE Student;` removes the table and all its data

## Adding data
```sql
INSERT INTO Student (studentID, name, email, yearOfStudy)
VALUES (1, 'Ada Lovelace', 'ada@example.com', 1);
```

@@ Databases/SQL DML Reads
---
session: 5 and 6
week: 8 and 9
module: Databases
---
Reading data with `SELECT`, the most-used part of **DML (Data Manipulation Language)**.

```sql
SELECT name, yearOfStudy
FROM Student
WHERE yearOfStudy = 1 AND name LIKE 'A%'
ORDER BY name;
```

## Building blocks
- `SELECT DISTINCT` removes duplicate rows
- `WHERE` filters rows with a predicate ([[Logical Implication and Predicate Logic]])
- Aggregates: `COUNT`, `SUM`, `AVG`, `MIN`, `MAX`
- `GROUP BY` makes one row per group; `HAVING` filters groups (`WHERE` filters rows)
- `NULL` needs `IS NULL`, not `= NULL`

## Joins
```sql
SELECT s.name, e.moduleCode
FROM Student s
JOIN Enrolment e ON s.studentID = e.studentID;
```
- `INNER JOIN`: only rows that match in both tables
- `LEFT JOIN`: every row from the left table, with `NULL` where there's no match

## Set operations and subqueries
- `UNION`, `INTERSECT`, `EXCEPT` work just like [[Set Operations and Relations]]
- A subquery is a `SELECT` inside another: `WHERE studentID IN (SELECT …)`

@@ Databases/Database Security
---
session: 7
week: 10
module: Databases
---
Keeping data confidential, accurate and available.

## Access control
- **Authentication:** proving who you are (passwords, keys)
- **Authorisation:** what you're allowed to do once you're in
- `GRANT SELECT ON Student TO tutor;` and `REVOKE …`
- **Roles** group permissions; give each user only the access they need (**least privilege**)

## Threats
- **SQL injection:** user input is pasted into a query and run as code, e.g. a login box given `' OR '1'='1`. The fix is **parameterised queries** (prepared statements), never building SQL by joining strings.
- Stolen backups or laptops: use **encryption** at rest and in transit
- Mistakes and failures: **backups** and audit logs

> [!note] The law
> In the UK, personal data is covered by UK GDPR and the Data Protection Act 2018.

How a DBMS keeps data reliable when many people use it at once.

## Transactions and ACID
A **transaction** is a group of operations that succeed or fail together (`BEGIN`, `COMMIT`, `ROLLBACK`).
- **Atomicity:** all or nothing
- **Consistency:** rules are never broken
- **Isolation:** concurrent transactions don't see each other's half-finished work
- **Durability:** once committed, it survives a crash

## Other jobs of the DBMS and the DBA
- **Concurrency control:** locking so two updates don't clash
- **Backup and recovery:** restoring after failure, using logs
- **Indexes:** speed up searches at the cost of slower writes and extra space
- **Performance tuning and monitoring**

## A first Java program
```java
public class Hello {
    public static void main(String[] args) {
        System.out.println("Hello, world!");
    }
}
```
- Every Java program lives in a **class**. The file name must match: `Hello.java`.
- `main` is where the program starts.
- Statements end with `;`. Blocks go in `{ }`.

## Compile, then run
1. `javac Hello.java` compiles the source into bytecode (`Hello.class`)
2. `java Hello` runs it on the Java Virtual Machine (JVM)

## Errors
- **Compile-time (syntax) errors:** the compiler refuses, e.g. a missing `;`
- **Runtime errors:** the program crashes while running, e.g. dividing an int by zero
- **Logic errors:** it runs but gives the wrong answer

## Variables and types
`int`, `double`, `boolean`, `char`, `String`. Java is **statically typed**: types are checked before the program runs. See also [[Variables]].

## Operators
- **Arithmetic:** `+ - * / %`. With two ints, `/` drops the decimal: `7 / 2` is `3`. `%` gives the remainder: `7 % 2` is `1`.
- **Assignment:** `=`, `+=`, `-=`, `++`, `--`
- **Comparison:** `== != < > <= >=`
- **Logical:** `&&`, `||`, `!`. They **short-circuit**: in `a && b`, b isn't checked if a is false.

## Conditionals
```java
if (mark >= 70) {
    System.out.println("First");
} else if (mark >= 60) {
    System.out.println("2:1");
} else {
    System.out.println("Keep going");
}

String result = (mark >= 40) ? "Pass" : "Fail";   // ternary operator

switch (day) {
    case 1: System.out.println("Monday"); break;
    default: System.out.println("Another day");
}
```

> [!warning] Comparing Strings
> Use `a.equals(b)`, not `a == b`. `==` checks whether they're the same object, not the same text.

> [!tip]
> Conditions are propositions: [[Propositional Logic]] tells you how to simplify them.

## Arrays
```java
int[] marks = new int[5];          // five ints, all 0
int[] primes = {2, 3, 5, 7, 11};
System.out.println(primes.length); // 5
System.out.println(primes[0]);     // 2: indexes start at 0
```
- Fixed size once created.
- Reading `primes[5]` throws `ArrayIndexOutOfBoundsException`.

## Loops
```java
for (int i = 0; i < marks.length; i++) { marks[i] = i * 10; }
for (int m : primes) { System.out.println(m); }     // enhanced for
while (n > 0) { n = n / 2; }
do { input = read(); } while (input < 0);            // runs at least once
```
- `break` leaves a loop; `continue` skips to the next pass.

  });

/* ---------- folders & tree ---------- */
function allFolders() {

  },
  hit(sx, sy) {

  bind() {

/* ---------- navigation ---------- */
function openNote(id, { newTab = false, mode } = {}) {
  if (!state.notes.has(id) && !SPECIAL.has(id)) return;
  if (mode) state.modes[id] = mode;
  if (!state.tabs.includes(id)) {
    const k = state.tabs.indexOf(state.active);
    if (newTab || k < 0 || SPECIAL.has(state.active)) state.tabs.splice(k + 1, 0, id);
    else state.tabs[k] = id;
  }
  state.active = id;
  if (!SPECIAL.has(id)) { state.lastNote = id; revealInTree(id); }
  view.key = null;
  renderAll();
  if (innerWidth <= 700) $("#left").hidden = true;
}
function revealInTree(id) {
  const n = state.notes.get(id); if (!n || !n.folder) return;
  const parts = n.folder.split("/"); let changed = false;
  for (let k = 1; k <= parts.length; k++) { const f = parts.slice(0, k).join("/"); if (state.collapsed.delete(f)) changed = true; }
  if (changed) saveCollapsed();
}
function closeTab(id) {
  if (id === "home") return;
  const k = state.tabs.indexOf(id); if (k < 0) return;
  state.tabs.splice(k, 1);
  if (state.active === id) state.active = state.tabs[Math.min(k, state.tabs.length - 1)] || null;
  view.key = null; renderAll();
}
function saveCollapsed() { lsSet("lv-collapsed", JSON.stringify([...state.collapsed])); }
function toggleMode() {
  const n = activeNote(); if (!n || n.kind !== "note") return;
  state.modes[n.id] = (state.modes[n.id] || "read") === "read" ? "edit" : "read";
  view.key = null; renderHeader(); renderView(true);
  if (state.modes[n.id] === "edit") { const ta = $("#editor"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function openLink(title, newTab) {
  const n = findByTitle(title);
  if (n) openNote(n.id, { newTab });
  else createNote(activeNote() ? activeNote().folder : "My Notes", title);
}

/* ---------- note operations ---------- */
function uniqueTitle(base, ignoreId) {
  let t = base, k = 1;
  while (allNotes().some(n => n.id !== ignoreId && n.title.toLowerCase() === t.toLowerCase())) t = `${base} ${k++}`;
  return t;
}
function createNote(folder = "My Notes", title = "Untitled", body = "") {
  let status = null;
  const weeks = allNotes().filter(n => n.folder === folder && /^week \d+$/i.test(n.title)).map(n => +n.title.match(/\d+/)[0]);
  if (title === "Untitled" && weeks.length) {
    const w = Math.max(...weeks) + 1;
    title = "Week " + w; status = "new";
    body = `---\nweek: ${w}\nmodule: ${folder.split("/").pop()}\n---\n## Topics covered\n- \n\n## Key terms\n- \n\n## Questions to ask\n- [ ] \n\n## My notes\n`;
  }
  const n = { id: newId(), title: uniqueTitle(title.trim() || "Untitled"), folder: folder || "", body, kind: "note", status, order: 9999, updated: Date.now(), touched: true };
  state.notes.set(n.id, n);
  if (n.folder) state.collapsed.delete(n.folder);
  Store.queue(n.id);
  openNote(n.id, { mode: "edit" });
  const ti = $("#inline-title"); if (ti && title === "Untitled") { ti.focus(); ti.select(); } else { const ta = $("#editor"); if (ta) ta.focus(); }
  return n;
}
function renameNote(n, raw) {
  let t = raw.replace(/[\[\]|#^\\/:]/g, "").trim();
  if (!t || t === n.title) { renderView(true); return; }
  if (allNotes().some(o => o.id !== n.id && o.title.toLowerCase() === t.toLowerCase())) { toast(`A note called “${t}” already exists.`); renderView(true); return; }
  const old = n.title; n.title = t;
  const re = new RegExp("(!?\\[\\[)" + old.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?=\\]\\]|\\||#)", "gi");
  let count = 0;
  for (const o of allNotes()) {
    if (o.kind !== "note" || o.id === n.id) continue;
    const nb = o.body.replace(re, (m, p) => { count++; return p + t; });
    if (nb !== o.body) { o.body = nb; touch(o, { render: false }); }
  }
  touch(n, { render: false }); view.key = null; renderAll();
  if (count) toast(`Renamed. Updated ${count} link${count > 1 ? "s" : ""} in other notes.`);
}
async function deleteNote(n) {
  const ok = await dialog({ title: `Delete “${n.title}”?`, text: isBuiltin(n.id) ? "This removes it from your vault. Links to it will show as uncreated." : "This can't be undone.", confirm: "Delete", danger: true });
  if (!ok) return;
  state.notes.delete(n.id);
  if (isBuiltin(n.id)) state.deleted.add(n.id);
  Store.queue(n.id);
  if (n.assetId && Store.assets) { try { await Store.assets.delete(n.assetId); } catch (e) {} }
  if (state.tabs.includes(n.id)) closeTab(n.id); else renderAll();
}
function moveNote(n, folder) {
  if ((n.folder || "") === folder) return;
  n.folder = folder; if (folder) state.collapsed.delete(folder);
  touch(n);
}
function setStatus(n, s) { n.status = s === "none" ? null : s; touch(n); }
async function newFolder(parent = "") {
  const name = await dialog({ title: "New folder", text: parent ? `Inside ${parent}` : "Use folders for modules, weeks or topics.", input: "", placeholder: "Folder name", confirm: "Create" });
  if (!name) return;
  const clean = name.replace(/[\\/:#|\[\]^]/g, "").trim(); if (!clean) return;
  const path = parent ? parent + "/" + clean : clean;
  if (allFolders().has(path)) { toast("That folder already exists."); return; }
  state.userFolders.add(path); state.collapsed.delete(parent);
  Store.queue("_meta"); renderLeft();
}
async function renameFolder(path) {
  const name = await dialog({ title: "Rename folder", input: path.split("/").pop(), confirm: "Rename" });
  if (!name) return;
  const clean = name.replace(/[\\/:#|\[\]^]/g, "").trim(); if (!clean) return;
  const np = path.split("/").slice(0, -1).concat(clean).join("/");
  if (np === path) return;
  const swap = f => f === path ? np : f.startsWith(path + "/") ? np + f.slice(path.length) : f;
  allNotes().forEach(n => { const nf = swap(n.folder); if (nf !== n.folder) { n.folder = nf; touch(n, { render: false }); } });
  state.userFolders = new Set([...state.userFolders].map(swap)); state.userFolders.add(np);
  if (folderOrder.has(path)) folderOrder.set(np, folderOrder.get(path));
  Store.queue("_meta"); renderAll();
}
async function deleteFolder(path) {
  const inside = allNotes().filter(n => n.folder === path || n.folder.startsWith(path + "/"));
  const ok = await dialog({ title: `Delete “${path.split("/").pop()}”?`, text: inside.length ? `This also deletes the ${inside.length} note${inside.length > 1 ? "s" : ""} and files inside it.` : "The folder is empty.", confirm: "Delete", danger: true });
  if (!ok) return;
  for (const n of inside) { state.notes.delete(n.id); if (isBuiltin(n.id)) state.deleted.add(n.id); Store.queue(n.id); state.tabs = state.tabs.filter(t => t !== n.id); }
  state.userFolders = new Set([...state.userFolders].filter(f => f !== path && !f.startsWith(path + "/")));
  Store.queue("_meta");
  if (!state.tabs.includes(state.active)) state.active = state.tabs[0] || null;
  view.key = null; renderAll();
}

/* ---------- import (drag & drop, file picker, paste) ---------- */
const TEXT_NOTE = /\.(md|markdown|txt)$/i;
function collectDropped(dt) {
  const items = [...(dt.items || [])].filter(i => i.kind === "file");
  const entries = items.map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null);
  if (!entries.length || entries.some(e => !e)) return Promise.resolve([...dt.files].map(f => ({ file: f, dir: "" })));
  const out = [];
  const walk = async (entry, dir) => {
    if (entry.name.startsWith(".")) return;
    if (entry.isFile) { try { out.push({ file: await new Promise((res, rej) => entry.file(res, rej)), dir }); } catch (e) {} }
    else if (entry.isDirectory) {
      const reader = entry.createReader(); const sub = dir ? dir + "/" + entry.name : entry.name;
      let batch;
      do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)).catch(() => []); for (const e of batch) await walk(e, sub); } while (batch.length);
    }
  };
  return (async () => { for (const e of entries) await walk(e, ""); return out; })();
}
async function importAll(list, target, { insertInto } = {}) {
  if (!list.length) return;
  const made = []; let ephemeral = 0, failed = 0;
  for (const { file, dir } of list) {
    const folder = [target, dir].filter(Boolean).join("/");
    try {
      if (TEXT_NOTE.test(file.name)) {
        let text = await file.text();
        if (text.length > 240000) { text = text.slice(0, 240000); toast(`${file.name} was very long, so only the first part was imported.`); }
        const n = { id: newId(), title: uniqueTitle(file.name.replace(TEXT_NOTE, "").replace(/[\[\]|#^]/g, "")), folder, body: text, kind: "note", status: null, order: 9999, updated: Date.now(), touched: true };
        state.notes.set(n.id, n); Store.queue(n.id); made.push(n);
      } else {
        const n = { id: newId(), title: uniqueTitle(file.name.replace(/[\[\]|#^]/g, "")), folder, body: "", kind: "file", status: null, mime: file.type || "application/octet-stream", size: file.size, order: 9999, updated: Date.now(), touched: true };
        let stored = false;
        if (Store.assets && file.size <= 20 * 1024 * 1024) {
          try { const a = await Store.assets.upload(file); n.assetId = a.id; n.url = a.url || "/_blob/" + a.id; if (a.contentType) n.mime = a.contentType; stored = true; }
          catch (e) { if (e && /quota|exhaust/i.test(String(e.code || e.message))) toast("File storage is full. Delete some files to add more."); }
        }
        if (!stored) { n.url = URL.createObjectURL(file); n.ephemeral = true; ephemeral++; }
        state.notes.set(n.id, n); if (!n.ephemeral) Store.queue(n.id); made.push(n);
      }
    } catch (e) { failed++; }
  }
  if (target) state.collapsed.delete(target);
  [...new Set(made.map(n => n.folder))].forEach(f => { const p = f.split("/"); for (let k = 1; k <= p.length; k++) state.collapsed.delete(p.slice(0, k).join("/")); });

    </dl>
    <div class="btns"><button class="btn" data-r="start">Read the full guide</button><button class="btn primary" data-r="close">Close</button></div></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if (e.target === bg) close(); const b = e.target.closest("[data-r]"); if (!b) return; close(); if (b.dataset.r === "start") { const s = findByTitle("Start Here"); if (s) openNote(s.id, { newTab: true }); } });
  bg.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  bg.querySelector(".btn.primary").focus();
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 4200);
}

/* ---------- events ---------- */
function setIcons() {
  const set = (id, n) => { $(id).innerHTML = ico(n); };
  set("#rb-left", "panelL"); set("#rb-switch", "switcher"); set("#rb-graph", "graph"); set("#rb-new", "edit"); set("#rb-import", "upload");
  set("#rb-galaxy", "galaxy"); set("#rb-help", "keyboard"); set("#rb-right", "panelR"); set("#lt-files", "folder"); set("#lt-search", "search"); set("#lt-newnote", "filePlus"); set("#lt-newfolder", "folderPlus");
}
function newNoteHere() { const n = activeNote(); createNote(n ? n.folder || "My Notes" : "My Notes"); }
function home() { if (state.homeMode !== "galaxy") { state.homeMode = "galaxy"; lsSet("lv-homemode", "galaxy"); view.key = null; } openNote("home"); }
function bindUi() {
  $("#rb-left").onclick = () => { $("#left").hidden = !$("#left").hidden; };
  $("#rb-right").onclick = () => { $("#right").hidden = !$("#right").hidden; };
  $("#rb-switch").onclick = openSwitcher;
  $("#rb-graph").onclick = () => openNote("graph", { newTab: true });
  $("#rb-new").onclick = newNoteHere;
  $("#rb-import").onclick = () => pickFiles(null);
  $("#rb-galaxy").onclick = home;
  $("#rb-help").onclick = openHelp;
  $("#lt-files").onclick = () => { state.left = "files"; $("#left-body").innerHTML = ""; renderLeft(); };
  $("#lt-search").onclick = () => { state.left = "search"; $("#left-body").innerHTML = ""; renderLeft(); $("#search-in").focus(); };
  $("#lt-newnote").onclick = newNoteHere;
  $("#lt-newfolder").onclick = () => newFolder("");

  const left = $("#left-body");
  left.addEventListener("click", e => {
    const row = e.target.closest("[data-folder-row]");
    if (row) { const f = row.dataset.folderRow; state.collapsed.has(f) ? state.collapsed.delete(f) : state.collapsed.add(f); saveCollapsed(); renderLeft(); return; }
    const it = e.target.closest("[data-id]");
    if (it) openNote(it.dataset.id, { newTab: e.ctrlKey || e.metaKey });
  });
  left.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const t = e.target.closest("[data-folder-row],[data-id]"); if (t) { e.preventDefault(); t.click(); } } });
  left.addEventListener("contextmenu", e => {
    const it = e.target.closest(".tree-note"); const fr = e.target.closest("[data-folder-row]");
    if (it) {
      e.preventDefault(); const n = state.notes.get(it.dataset.id); if (!n) return;
      showCtx(e.clientX, e.clientY, [
        { icon: "file", label: "Open in new tab", run: () => openNote(n.id, { newTab: true }) },
        { icon: "edit", label: "Rename", run: async () => { const t = await dialog({ title: "Rename", input: n.title, confirm: "Rename" }); if (t) renameNote(n, t); } },
        ...(n.kind === "note" ? [{ icon: "check", label: n.status ? "Stop tracking progress" : "Track as a concept", run: () => setStatus(n, n.status ? "none" : "new") }] : []),
        "-", { icon: "trash", label: "Delete", danger: true, run: () => deleteNote(n) }
      ]);
    } else if (fr) {
      e.preventDefault(); const f = fr.dataset.folderRow;
      showCtx(e.clientX, e.clientY, [
        { icon: "filePlus", label: "New note here", run: () => createNote(f) },
        { icon: "folderPlus", label: "New folder inside", run: () => newFolder(f) },
        { icon: "upload", label: "Import files here", run: () => pickFiles(f) },
        { icon: "edit", label: "Rename folder", run: () => renameFolder(f) },
        "-", { icon: "trash", label: "Delete folder", danger: true, run: () => deleteFolder(f) }
      ]);
    }
  });
  left.addEventListener("dragstart", e => {
    const it = e.target.closest(".tree-note"); if (!it) return;
    e.dataTransfer.setData(INTERNAL, it.dataset.id); e.dataTransfer.effectAllowed = "move";
  });

  $("#tabbar").addEventListener("click", e => {
    const x = e.target.closest("[data-close]"); if (x) { e.stopPropagation(); closeTab(x.dataset.close); return; }
    if (e.target.closest("#tab-add")) { newNoteHere(); return; }
    const t = e.target.closest("[data-tab]"); if (t && t.dataset.tab !== state.active) { state.active = t.dataset.tab; view.key = null; renderAll(); }
  });
  $("#tabbar").addEventListener("auxclick", e => { const t = e.target.closest("[data-tab]"); if (t && e.button === 1) closeTab(t.dataset.tab); });

  $("#view-header").addEventListener("click", e => {
    const n = activeNote();
    if (e.target.closest("#mode-btn")) toggleMode();
    const hs = e.target.closest("[data-hstatus]"); if (hs && n) setStatus(n, hs.dataset.hstatus);
  });

  $("#view").addEventListener("click", e => {
    const a = e.target.closest("a.internal-link"); if (a) { e.preventDefault(); openLink(a.dataset.target, e.ctrlKey || e.metaKey); return; }
    const tg = e.target.closest("a.tag"); if (tg) { e.preventDefault(); state.left = "search"; state.query = "#" + tg.dataset.tag; $("#left").hidden = false; $("#left-body").innerHTML = ""; renderLeft(); return; }
    const gm = e.target.closest("[data-home-mode]"); if (gm) { state.homeMode = gm.dataset.homeMode; lsSet("lv-homemode", state.homeMode); view.key = null; renderView(true); return; }
    const gf = e.target.closest("[data-gfocus]"); if (gf) { gf.dataset.gfocus ? Galaxy.focusCluster(gf.dataset.gfocus) : Galaxy.overview(); return; }
    const gs = e.target.closest("[data-gsel]"); if (gs) { Galaxy.select(gs.dataset.gsel); return; }
    const gst = e.target.closest("[data-gstatus]"); if (gst && Galaxy.sel) { const gn = state.notes.get(Galaxy.sel); if (gn) setStatus(gn, gst.dataset.gstatus); return; }
    const gz = e.target.closest("[data-gzoom]"); if (gz) { Galaxy.zoomBtn(gz.dataset.gzoom); return; }
    const gmd = e.target.closest("[data-gmode]"); if (gmd) { Galaxy.mode = gmd.dataset.gmode; lsSet("lv-galmode", Galaxy.mode); Galaxy.renderPanels(); return; }
    const go = e.target.closest("[data-go]"); if (go) { openNote(go.dataset.go); return; }
    const mn = e.target.closest("[data-master-next]");
    if (mn) { const cn = state.notes.get(mn.dataset.masterNext); if (cn) { const { next } = conceptNeighbours(cn); setStatus(cn, "mastered"); if (next) openNote(next.id); else toast(`Nice. That's the last concept in ${cn.folder}.`); } return; }
    const op = e.target.closest("[data-open]"); if (op) { openNote(op.dataset.open, { newTab: true }); return; }
    const act = e.target.closest("[data-act]");
    if (act) ({ new: newNoteHere, switch: openSwitcher, graph: () => openNote("graph", { newTab: true }), import: () => pickFiles(null), home, pick: () => pickFiles("My Notes"), folder: () => newFolder(""), start: () => { const s = findByTitle("Start Here"); if (s) openNote(s.id, { newTab: true }); } })[act.dataset.act]();
  });
  $("#view").addEventListener("dblclick", e => {
    const n = activeNote(); if (!n || n.kind !== "note" || (state.modes[n.id] || "read") !== "read") return;
    if (e.target.closest("a,input,button")) return;
    if (e.target.closest("#md")) toggleMode();
  });

  $("#right-body").addEventListener("click", e => {
    const n = activeNote();
    const st = e.target.closest("[data-status]"); if (st && n) { setStatus(n, st.dataset.status); return; }
    const li = e.target.closest("[data-id]"); if (li) { openNote(li.dataset.id); return; }
    const cr = e.target.closest("[data-create]"); if (cr) { createNote(n ? n.folder : "My Notes", cr.dataset.create); return; }
    const oh = e.target.closest("[data-h]");
    if (oh && n) {
      if ((state.modes[n.id] || "read") === "edit") toggleMode();
      const h = document.querySelector(`#md [data-h="${oh.dataset.h}"]`); if (h) h.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  $("#right-body").addEventListener("keydown", e => { if (e.key === "Enter") { const t = e.target.closest("[data-id],[data-create]"); if (t) t.click(); } });
  $("#left-body").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".result")) e.target.click(); });

  document.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
    if (mod && (k === "p" || k === "k" || k === "o")) { e.preventDefault(); openSwitcher(); }
    else if (mod && k === "e") { e.preventDefault(); toggleMode(); }
    else if (mod && k === "g") { e.preventDefault(); openNote("graph", { newTab: true }); }
    else if (e.altKey && k === "n") { e.preventDefault(); newNoteHere(); }
    else if (e.altKey && k === "w" && state.active) { e.preventDefault(); closeTab(state.active); }
    else if (e.key === "Escape") { closeCtx(); if (state.active === "home" && Galaxy.el && !document.querySelector(".modal-bg")) { if (Galaxy.sel) { Galaxy.sel = null; Galaxy.renderPanels(); } else if (Galaxy.focus) Galaxy.overview(); } }
  });
  const retheme = () => { if (state.active === "graph") Graph.rebuild(); if (state.active === "home") { Constellation.readColors(); Constellation.draw(performance.now()); } };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  addEventListener("beforeunload", () => { for (const id of [...Store.dirty.keys()]) { clearTimeout(Store.timers.get(id)); Store.flush(id); } });
}

/* ---------- start ---------- */
parseSeed();
setIcons();
bindUi();
if (innerWidth <= 1000) $("#right").hidden = true;
if (innerWidth <= 700) $("#left").hidden = true;
state.tabs = ["home"]; state.active = "home";
renderAll();
Store.init();
})();
</script>
</body>
</html>
