<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: ribbon | file explorer | tabbed note pane | properties & links panel. Obsidian-like workspace, tuned for studying. */
:root{
  --bg:#ffffff;
  --bg-2:#f6f5f8;
  --bg-3:#ecebf0;
  --hover:rgba(30,20,60,.06);
  --border:#e1dfe7;
  --text:#24222b;
  --muted:#6b6878;
  --faint:#9a97a6;
  --accent:#6f4fd8;
  --accent-soft:rgba(111,79,216,.12);
  --link:#5b3fc4;
  --code-bg:#f1eff5;
  --s-new:#a3a0ae;
  --s-learn:#c98a14;
  --s-done:#2f9e6a;
  --danger:#c93c3c;
  --g1:#6f4fd8;--g2:#d0632b;--g3:#2f8fb3;--g4:#2f9e6a;--g5:#c0418a;--g6:#8a8696;
  --shadow:0 8px 30px rgba(20,10,40,.14);
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1e21;--bg-2:#26262a;--bg-3:#19191c;--hover:rgba(255,255,255,.06);--border:#34343a;
    --text:#dcdbe2;--muted:#a09dab;--faint:#6d6a78;--accent:#9a7bff;--accent-soft:rgba(154,123,255,.16);
    --link:#b39dff;--code-bg:#2b2b31;--s-new:#6d6a78;--s-learn:#e0a335;--s-done:#4cc38a;--danger:#ef6b6b;
    --g1:#9a7bff;--g2:#f08a4b;--g3:#4fb4d8;--g4:#4cc38a;--g5:#e06aae;--g6:#8f8b9c;
    --shadow:0 10px 36px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1e21;--bg-2:#26262a;--bg-3:#19191c;--hover:rgba(255,255,255,.06);--border:#34343a;
  --text:#dcdbe2;--muted:#a09dab;--faint:#6d6a78;--accent:#9a7bff;--accent-soft:rgba(154,123,255,.16);
  --link:#b39dff;--code-bg:#2b2b31;--s-new:#6d6a78;--s-learn:#e0a335;--s-done:#4cc38a;--danger:#ef6b6b;
  --g1:#9a7bff;--g2:#f08a4b;--g3:#4fb4d8;--g4:#4cc38a;--g5:#e06aae;--g6:#8f8b9c;
  --shadow:0 10px 36px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}

.app{display:grid;grid-template-columns:44px auto minmax(0,1fr) auto;height:100%}
.ribbon{background:var(--bg-3);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.ribbon .sp{flex:1}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.on{color:var(--accent)}

.sidebar{width:272px;background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0}
.sidebar.right{border-right:0;border-left:1px solid var(--border);width:280px}
.sidebar[hidden]{display:none}
.side-head{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);min-height:40px}
.side-head .title{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:6px;flex:1}
.side-body{flex:1;overflow:auto;padding:6px 6px 12px;min-height:0}

/* tree */
.tree-folder>.row,.tree-note{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;cursor:pointer;color:var(--muted);user-select:none;min-height:26px}
.tree-folder>.row:hover,.tree-note:hover{background:var(--hover);color:var(--text)}
.tree-note.active{background:var(--accent-soft);color:var(--text)}
.tree-folder>.row{color:var(--text);font-weight:500}
.tree-folder .chev{transition:transform .15s;color:var(--faint)}
.tree-folder.open>.row .chev{transform:rotate(90deg)}
.tree-children{margin-left:15px;border-left:1px solid var(--border);padding-left:4px}
.tree-folder:not(.open)>.tree-children{display:none}
.tree-note .name,.tree-folder .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s-new)}
.dot.learning{background:var(--s-learn)}
.dot.mastered{background:var(--s-done)}
.ext{font:500 10px/1 var(--font-mono);padding:3px 4px;border-radius:3px;background:var(--bg-3);color:var(--muted);text-transform:uppercase}
.prog{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:400}
.drop-target{background:var(--accent-soft)!important;outline:1px dashed var(--accent)}
.vault-foot{border-top:1px solid var(--border);padding:10px 14px;display:grid;gap:6px}
.vault-foot .vn{font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.vault-foot .vn span{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--bg-3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--s-done)}.bar .b-learn{background:var(--s-learn)}

/* search */
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;margin:4px 2px 8px}
.search-box input{border:0;outline:0;background:none;flex:1;min-width:0}
.result{padding:6px 8px;border-radius:5px;cursor:pointer}
.result:hover{background:var(--hover)}
.result .rt{font-weight:500}
.result .rs{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.result mark{background:var(--accent-soft);color:var(--text);border-radius:2px}
.empty-note{color:var(--faint);font-size:13px;padding:8px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.tabbar{height:40px;background:var(--bg-2);display:flex;align-items:flex-end;padding:0 6px;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;flex:none;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:7px 7px 0 0;max-width:200px;min-width:90px;color:var(--muted);cursor:pointer;flex:none;position:relative}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--border);clip-path:inset(-1px -1px 0 -1px)}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;opacity:.6}
.tab .x:hover{background:var(--hover);opacity:1}
.tab-add{height:32px;width:32px;display:grid;place-items:center;color:var(--muted);border-radius:6px;flex:none}
.tab-add:hover{background:var(--hover)}
.view-header{height:42px;display:flex;align-items:center;padding:0 10px 0 18px;gap:6px;flex:none}
.crumbs{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted)}
.pill:hover{border-color:var(--faint);color:var(--text)}
.pill.learning{color:var(--s-learn);border-color:color-mix(in srgb,var(--s-learn) 45%,transparent)}
.pill.mastered{color:var(--s-done);border-color:color-mix(in srgb,var(--s-done) 45%,transparent)}
.view-content{flex:1;overflow:auto;position:relative;min-height:0}
.doc{max-width:740px;margin:0 auto;padding:12px 36px 140px;position:relative}
.inline-title{display:block;width:100%;border:0;outline:0;background:none;font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.01em;padding:0;margin:8px 0 14px;text-wrap:balance}
.editor{display:block;width:100%;border:0;outline:0;resize:none;background:none;font:15.5px/1.7 var(--font-ui);color:var(--text);min-height:60vh;overflow:hidden;padding:0;tab-size:4}

/* rendered markdown */
.md{font-size:15.5px;line-height:1.7}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;text-wrap:balance;margin:1.6em 0 .5em}
.md h1{font-size:1.6em}.md h2{font-size:1.32em}.md h3{font-size:1.12em}.md h4{font-size:1em}
.md p{margin:.6em 0}
.md a{color:var(--link);text-decoration:none}
.md a:hover{text-decoration:underline}
.md a.unresolved{opacity:.6;text-decoration:underline dotted}
.md a.tag{background:var(--accent-soft);padding:1px 7px;border-radius:10px;font-size:.88em}
.md code{font:.86em var(--font-mono);background:var(--code-bg);padding:1px 5px;border-radius:4px}
.md pre{background:var(--code-bg);padding:12px 14px;border-radius:7px;overflow-x:auto;line-height:1.55}
.md pre code{background:none;padding:0;font-size:13px}
.md blockquote{margin:.8em 0;padding:2px 0 2px 16px;border-left:3px solid var(--accent);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:1.6em 0}
.md ul,.md ol{padding-left:1.5em;margin:.5em 0}
.md li{margin:.15em 0}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task input{margin:0 8px 0 0;vertical-align:-2px;accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.md li.task.done{color:var(--faint);text-decoration:line-through}
.md mark{background:color-mix(in srgb,var(--s-learn) 30%,transparent);color:inherit;padding:0 2px;border-radius:2px}
.md img{max-width:100%;border-radius:6px}
.table-wrap{overflow-x:auto;margin:.8em 0}
.md table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--border);padding:6px 12px;text-align:left}
.md th{background:var(--bg-2);font-weight:600}
.callout{--c:var(--g3);margin:1em 0;border-radius:7px;padding:10px 14px;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:3px solid var(--c)}
.callout[data-callout="tip"],.callout[data-callout="success"]{--c:var(--g4)}
.callout[data-callout="warning"],.callout[data-callout="caution"]{--c:var(--g2)}
.callout[data-callout="example"]{--c:var(--g1)}
.callout[data-callout="question"]{--c:var(--g5)}
.callout-title{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--c)}
.callout-content>*:last-child{margin-bottom:0}
.callout-content>*:first-child{margin-top:.3em}
.props{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;padding:10px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.props dt{color:var(--muted)}.props dd{margin:0}
.embed-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}

/* file view */
.file-view{padding:24px;display:grid;gap:14px;justify-items:center}
.file-view img,.file-view video{max-width:100%;max-height:75vh;border-radius:8px}
.file-view iframe{width:100%;height:78vh;border:1px solid var(--border);border-radius:8px;background:#fff}
.file-meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.file-meta a{color:var(--link)}
.file-text{width:100%;max-width:900px;background:var(--code-bg);border-radius:8px;padding:14px;font:13px/1.55 var(--font-mono);white-space:pre-wrap;overflow:auto;max-height:75vh}

/* empty state */
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:20px;margin:0 0 14px}
.empty .acts{display:grid;gap:6px}
.empty .acts button{color:var(--link)}
.empty .acts button:hover{text-decoration:underline}
.empty kbd,.kbd{font:11px var(--font-mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted)}

/* right panel */
.panel-sec{padding:10px 8px 6px}
.panel-sec+.panel-sec{border-top:1px solid var(--border)}
.panel-sec h4{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.panel-sec h4 span{font-variant-numeric:tabular-nums;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{padding:6px 4px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text);font-weight:500}
.link-item{display:block;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--text);font-size:13px}
.link-item:hover{background:var(--hover)}
.link-item small{display:block;color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-item.unres{color:var(--faint)}
.outline-item{display:block;padding:3px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline-item:hover{background:var(--hover);color:var(--text)}
.track-btn{width:100%;padding:7px;border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-size:12.5px}
.track-btn:hover{border-color:var(--accent);color:var(--text)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:12.5px;margin-top:10px}
.kv dt{color:var(--faint)}.kv dd{margin:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.statusbar{position:absolute;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:4px 12px;font-size:12px;color:var(--muted);background:var(--bg-2);border:1px solid var(--border);border-right:0;border-bottom:0;border-top-left-radius:8px;font-variant-numeric:tabular-nums;z-index:5}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--s-done)}.sync.warn i{background:var(--s-learn)}.sync.bad i{background:var(--danger)}

/* graph */
.graph-wrap{position:absolute;inset:0}
.graph-wrap canvas{display:block;width:100%;height:100%;cursor:grab}
.graph-wrap canvas.dragging{cursor:grabbing}
.graph-legend{position:absolute;left:14px;top:12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;display:grid;gap:4px;color:var(--muted)}
.graph-legend div{display:flex;align-items:center;gap:8px}
.graph-legend i{width:9px;height:9px;border-radius:50%}
.graph-hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--faint)}

/* home */
.home-wrap{position:relative;min-height:100%}
.home{max-width:1140px;margin:0 auto;padding:22px 36px 120px;display:grid;gap:30px}
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:radial-gradient(120% 140% at 85% 40%,var(--accent-soft),transparent 60%),var(--bg-2);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:40px 44px;min-height:360px;container-type:inline-size}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(canvas){position:relative;z-index:1}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display);font-size:clamp(40px,7.4cqi,78px);font-weight:800;line-height:.92;letter-spacing:-.035em;margin:14px 0 22px;text-wrap:balance;font-variation-settings:"opsz" 96}
.display em{font-style:normal;color:var(--accent)}
.next-card{display:grid;grid-template-columns:4px 1fr;gap:0 16px;max-width:520px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:14px;padding:16px 18px 16px 0;overflow:hidden}
.next-card .stripe{border-radius:0 3px 3px 0;background:var(--mc,var(--accent))}
.next-card .lbl{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.next-card h3{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 4px;line-height:1.1}
.next-card p{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:58ch}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600}
.cta:hover{filter:brightness(1.08)}
.ghost{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.ghost:hover{border-color:var(--faint)}
.ring-box{display:grid;align-content:center;justify-items:center;gap:14px}
.ring{position:relative;width:200px;height:200px;border-radius:50%;background:color-mix(in srgb,var(--bg-2) 78%,transparent);backdrop-filter:blur(3px);box-shadow:0 0 0 18px color-mix(in srgb,var(--bg-2) 40%,transparent)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--font-display);font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.sec-h span{color:var(--muted);font-size:13px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{--mc:var(--accent);position:relative;text-align:left;border:1px solid var(--border);border-radius:16px;background:var(--bg-2);padding:18px 18px 16px;display:grid;gap:10px;transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden}
.mod::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--mc)}
.mod:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--mc) 55%,var(--border));box-shadow:var(--shadow)}
.mod .num{font:600 12px var(--font-mono);color:var(--mc)}
.mod h3{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.mod .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mod .next{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.mod .next b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod.add{border-style:dashed;background:none;place-content:center;justify-items:center;text-align:center;color:var(--muted);min-height:150px}
.mod.add::before{display:none}
.mod.add:hover{color:var(--text)}
.home-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px}
.panel{border:1px solid var(--border);border-radius:16px;background:var(--bg-2);padding:18px}

@@ Discrete Mathematics/Discrete Mathematics
The maths of separate, countable things: the language computer science is written in. Sets give you a way to describe collections of data, logic gives you a way to reason about programs, and relations and functions describe how data connects.

## Suggested order
1. [[Set Notation]]
2. [[Subsets]]
3. [[Power Sets]]
4. [[Set Operations]]
5. [[Cardinality]]
6. [[Number Systems]]
7. [[Propositional Logic]]
8. [[Relations]]
9. [[Functions (Maths)]]

> [!example] Where it shows up later
> Database queries are set operations. A graph is a set of vertices plus a relation on them ([[Graphs]]). Proving an algorithm correct uses logic and induction.

#discrete-maths

@@ Discrete Mathematics/Set Notation
A **set** is an unordered collection of distinct objects, called its *elements* or *members*.

## Ways to write a set
- **Roster (listing):** `A = {1, 2, 3}`
- **Set-builder:** `B = { x ∈ ℤ | x > 0 }`, read as "the set of integers x such that x is greater than 0"
- **Empty set:** `∅` or `{}`, the set with no elements

## Membership
- `x ∈ A` means x is an element of A
- `x ∉ A` means x is not an element of A

> [!tip] Order and repetition don't matter
> `{1, 2, 3} = {3, 1, 2} = {1, 1, 2, 3}`. A set only records *whether* something is in it.

## Watch out
`∅` and `{∅}` are different. The first has no elements; the second has one element, which happens to be the empty set.

## Check yourself
- [ ] Write the even natural numbers below 10 in roster form
- [ ] Write the same set in set-builder notation
- [ ] Is `∅ ∈ {∅}` true? Is `∅ = {∅}` true?

Related: [[Subsets]], [[Cardinality]], [[Number Systems]]
#discrete-maths #sets

@@ Discrete Mathematics/Subsets
A is a **subset** of B, written `A ⊆ B`, if every element of A is also an element of B.

- **Proper subset:** `A ⊂ B` means `A ⊆ B` and `A ≠ B`, so B has at least one element A doesn't.
- **Superset:** `B ⊇ A` says the same thing as `A ⊆ B` from the other side.

## Facts to remember
- `∅ ⊆ A` for every set A, because there's nothing in ∅ that could fail to be in A.
- `A ⊆ A` for every set A.
- **Set equality:** `A = B` exactly when `A ⊆ B` and `B ⊆ A`. This is how you *prove* two sets are equal: show each is a subset of the other.

> [!example]
> `{1, 3} ⊆ {1, 2, 3}` and `{1, 3} ⊂ {1, 2, 3}`, but `{1, 4} ⊄ {1, 2, 3}` because 4 is missing.

## Don't mix up ∈ and ⊆
`1 ∈ {1, 2}` is true. `{1} ⊆ {1, 2}` is true. `1 ⊆ {1, 2}` doesn't make sense, because 1 isn't a set.

## Check yourself
- [ ] List every subset of `{a, b}`
- [ ] Is `{∅} ⊆ {∅, 1}`? Is `∅ ∈ {∅, 1}`?
- [ ] Explain why ∅ is a subset of every set

Related: [[Power Sets]], [[Set Operations]], [[Set Notation]]
#sets

@@ Discrete Mathematics/Power Sets
The **power set** of A, written `P(A)` or `℘(A)`, is the set of *all* subsets of A.

> [!example]
> `P({a, b}) = { ∅, {a}, {b}, {a, b} }`

## How big is it?
If A has n elements, `|P(A)| = 2ⁿ`.

Why: building a subset means deciding, for each of the n elements, *in* or *out*. That's 2 choices made n times, so 2 × 2 × … × 2 = 2ⁿ subsets. It's the same count as the number of n-bit binary strings, where each bit says whether an element is included.

## Edge cases
- `P(∅) = {∅}`, which has 1 element (2⁰ = 1)
- `P({∅}) = {∅, {∅}}`, which has 2 elements

## Check yourself
- [ ] Write out `P({1, 2, 3})` and check it has 8 elements
- [ ] How many subsets of `{1, 2, 3, 4, 5}` contain the element 1?
- [ ] Find `|P(P({x}))|`

Related: [[Subsets]], [[Cardinality]]
#sets

@@ Discrete Mathematics/Set Operations
Assume every set lives inside a **universal set** U.

| Operation | Notation | Contains |
| --- | --- | --- |
| Union | `A ∪ B` | elements in A or B (or both) |
| Intersection | `A ∩ B` | elements in both A and B |
| Difference | `A \ B` or `A − B` | elements in A but not in B |
| Complement | `A′` or `Aᶜ` | elements of U not in A |
| Symmetric difference | `A △ B` | elements in exactly one of A, B |
| Cartesian product | `A × B` | ordered pairs `(a, b)` with a ∈ A, b ∈ B |

A and B are **disjoint** if `A ∩ B = ∅`.

## De Morgan's laws
- `(A ∪ B)′ = A′ ∩ B′`
- `(A ∩ B)′ = A′ ∪ B′`

These mirror the logic versions in [[Propositional Logic]]: "not (p or q)" is "not p and not q".

> [!tip] Draw it
> Venn diagrams are the quickest way to sanity-check an identity before you prove it properly with [[Subsets]].

## Check yourself
- [ ] With `A = {1,2,3}` and `B = {2,3,4}`, find `A ∪ B`, `A ∩ B`, `A \ B` and `A △ B`
- [ ] Write out `{0,1} × {a,b}`
- [ ] Prove `A \ B = A ∩ B′`

Related: [[Cardinality]], [[Relations]]
#sets

@@ Discrete Mathematics/Cardinality
The **cardinality** of a finite set A, written `|A|`, is the number of elements it has.

- `|∅| = 0`
- `|{∅}| = 1`
- `|{a, b, a}| = 2`, because duplicates don't count

## Counting rules
- **Inclusion–exclusion:** `|A ∪ B| = |A| + |B| − |A ∩ B|`. You subtract the overlap because it was counted twice.
- **Product:** `|A × B| = |A| · |B|`
- **Power set:** `|P(A)| = 2^|A|` (see [[Power Sets]])

## Infinite sets
Two sets have the same cardinality when there's a bijection between them (see [[Functions (Maths)]]).
- **Countably infinite:** same size as ℕ. ℤ and ℚ are both countable, which surprises most people.
- **Uncountable:** ℝ is strictly bigger than ℕ. Cantor's diagonal argument proves no list can contain every real number.

## Check yourself
- [ ] 40 students take Maths, 30 take CS and 12 take both. How many take at least one?
- [ ] What is `|{1, {1}, {1, {1}}}|`?
- [ ] Describe a bijection between ℕ and the even natural numbers

Related: [[Number Systems]], [[Set Operations]]
#sets

@@ Discrete Mathematics/Number Systems
## The standard sets
`ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ`

| Symbol | Name | Examples |
| --- | --- | --- |
| ℕ | Natural numbers | 0, 1, 2, 3, … |
| ℤ | Integers | …, −2, −1, 0, 1, 2, … |
| ℚ | Rationals | ½, −3/4, 5, 0.75 |
| ℝ | Reals | π, √2, −1.5 |
| ℂ | Complex | 3 + 2i, i |

> [!warning] Is 0 a natural number?
> Many CS courses include 0 in ℕ, and some maths texts don't. Check which convention your module uses and stick to it in exams.

A real number that isn't rational is **irrational**. `√2` is the classic example, and proving it is a standard proof by contradiction.

## Number bases
Computers store numbers in base 2.
- Decimal `13` = binary `1101₂` (8 + 4 + 0 + 1) = hex `D₁₆`
- Each hex digit is exactly 4 binary digits, which is why hex is used to write bytes.

## Check yourself
- [ ] Which of these are in ℚ: 0.333…, √9, π, −7?
- [ ] Convert 45 to binary and to hex
- [ ] Write ℤ⁺ (the positive integers) in set-builder notation

Related: [[Set Notation]], [[Cardinality]], [[Variables and Types]]
#number-systems

@@ Discrete Mathematics/Propositional Logic
A **proposition** is a statement that is either true or false. "7 is prime" is a proposition; "close the door" isn't.

## Connectives
| Symbol | Name | Read as |
| --- | --- | --- |
| `¬p` | negation | not p |
| `p ∧ q` | conjunction | p and q |
| `p ∨ q` | disjunction | p or q (or both) |
| `p → q` | implication | if p then q |
| `p ↔ q` | biconditional | p if and only if q |

## The one that trips people up
`p → q` is only false when p is true and q is false.

```
p  q | p → q
T  T |   T
T  F |   F
F  T |   T
F  F |   T
```

## Key ideas
- **Tautology:** always true, e.g. `p ∨ ¬p`
- **Contradiction:** always false, e.g. `p ∧ ¬p`
- **Contrapositive:** `p → q` is equivalent to `¬q → ¬p`
- **De Morgan:** `¬(p ∧ q) ≡ ¬p ∨ ¬q`, matching [[Set Operations]] where ∧ is ∩ and ∨ is ∪

## Check yourself
- [ ] Build the truth table for `(p → q) ∧ (q → p)` and compare it with `p ↔ q`
- [ ] Write the contrapositive of "if n is even, then n² is even"
- [ ] Translate `if not (a and b)` in code into an equivalent condition without the outer not

Related: [[Control Flow]], [[Relations]]
#logic

@@ Discrete Mathematics/Relations
A **relation** R from A to B is any subset of `A × B`. We write `a R b` when `(a, b) ∈ R`. A relation *on* A is a subset of `A × A`.

## Properties of a relation on A
- **Reflexive:** `a R a` for every a
- **Symmetric:** if `a R b` then `b R a`
- **Antisymmetric:** if `a R b` and `b R a` then `a = b`
- **Transitive:** if `a R b` and `b R c` then `a R c`

## Two important kinds
- **Equivalence relation:** reflexive, symmetric and transitive. It splits A into equivalence classes. Example: "same remainder mod 3" on ℤ.
- **Partial order:** reflexive, antisymmetric and transitive. Example: `≤` on ℕ, or `⊆` on a set of sets.

> [!example]
> A directed graph *is* a relation: the edges are the pairs. See [[Graphs]].

## Check yourself
- [ ] Is "is a sibling of" reflexive? Symmetric? Transitive?
- [ ] List the equivalence classes of "same remainder mod 3" on `{0, …, 8}`
- [ ] Show that `⊆` is a partial order

Related: [[Set Operations]], [[Functions (Maths)]]
#relations

@@ Discrete Mathematics/Functions (Maths)
A **function** `f: A → B` is a relation that pairs every element of A with *exactly one* element of B.

- **Domain:** A
- **Codomain:** B
- **Range (image):** the elements of B actually hit, `{ f(a) | a ∈ A }`

## Types of function
- **Injective (one-to-one):** different inputs give different outputs
- **Surjective (onto):** every element of B is hit by some input
- **Bijective:** both. Every element of B is hit by exactly one input.

A function has an **inverse** `f⁻¹` exactly when it's bijective.

## Composition
`(g ∘ f)(x) = g(f(x))`: apply f first, then g.

> [!tip] Link to code
> A pure function in a program behaves like a maths function: same input, same output, no side effects. See [[Functions and Scope]].

## Check yourself
- [ ] Is `f(x) = x²` from ℤ to ℤ injective? Surjective?
- [ ] Give a bijection from `{1, 2, 3}` to `{a, b, c}` and write its inverse
- [ ] Why can't there be an injection from a 5-element set into a 4-element set?

Related: [[Relations]], [[Cardinality]]
#functions

@@ Programming Fundamentals/Programming Fundamentals
The building blocks every program is made from. Examples use Python, but the ideas carry to any language.

## Suggested order
1. [[Variables and Types]]
2. [[Control Flow]]
3. [[Functions and Scope]]
4. [[Recursion]]

Once these feel solid, move on to [[Data Structures]].

#programming

@@ Programming Fundamentals/Variables and Types
A **variable** is a name bound to a value. A **type** says what kind of value it is and what you can do with it.

```python
age = 19          # int
height = 1.78     # float
name = "Ada"      # str
enrolled = True   # bool
```

## Static vs dynamic typing
- **Static** (Java, C): types are checked before the program runs. `int x = "hi";` won't compile.
- **Dynamic** (Python, JavaScript): types belong to values and are checked as the program runs.

> [!warning] Floats aren't exact
> `0.1 + 0.2 == 0.3` is `False` in most languages, because floats store binary approximations. Compare with a tolerance instead.

## Check yourself
- [ ] What does `type(7 / 2)` return in Python? What about `7 // 2`?
- [ ] Explain why integers in Python never overflow but in Java they can
- [ ] Which values are "falsy" in Python?

Related: [[Number Systems]], [[Control Flow]]
#programming

@@ Programming Fundamentals/Control Flow
Control flow decides which lines run, and how often.

## Branching
```python
if score >= 70:
    grade = "First"
elif score >= 60:
    grade = "2:1"
else:
    grade = "Other"
```

## Loops
```python
for i in range(1, 16):
    if i % 15 == 0:
        print("FizzBuzz")
    elif i % 3 == 0:
        print("Fizz")
    elif i % 5 == 0:
        print("Buzz")
    else:
        print(i)
```
- `for` loops over a sequence; `while` repeats until a condition is false.
- `break` leaves the loop; `continue` skips to the next pass.

> [!tip]
> Every condition is a proposition. Simplifying a tangled `if` is just [[Propositional Logic]].

## Check yourself
- [ ] Rewrite the FizzBuzz loop using `while`
- [ ] When would a `while` loop never run at all?
- [ ] Simplify `if not (x > 5 or y < 2):`

Related: [[Functions and Scope]], [[Recursion]]
#programming

@@ Programming Fundamentals/Functions and Scope
A **function** packages a piece of logic behind a name so you can reuse it.

```python
def average(values):
    total = sum(values)        # local variable
    return total / len(values)
```

## Scope
- Variables made inside a function are **local**: they vanish when it returns.
- Variables at the top level of a file are **global**. Reading them inside a function works; reassigning them needs `global`, and is usually a bad sign.

## Pure functions
A function is **pure** if its output depends only on its inputs and it changes nothing outside itself. Pure functions are easier to test, and they line up with [[Functions (Maths)]].

## Check yourself
- [ ] What does a Python function return if it has no `return` statement?
- [ ] Write a pure function that returns the largest of three numbers
- [ ] Explain what happens to `total` after `average` returns

Related: [[Recursion]], [[Stacks and Queues]]
#programming

@@ Programming Fundamentals/Recursion
A **recursive** function solves a problem by calling itself on a smaller version of the same problem.

Every recursive function needs:
1. a **base case** that stops the recursion, and
2. a **recursive case** that moves towards the base case.

```python
def factorial(n):
    if n == 0:              # base case
        return 1
    return n * factorial(n - 1)   # recursive case
```

## What's happening underneath
Each call is pushed onto the **call stack** ([[Stacks and Queues]]) and popped when it returns. Forget the base case and the stack overflows.

> [!warning] Naive recursion can be slow
> `fib(n) = fib(n-1) + fib(n-2)` recomputes the same values again and again, giving exponential time. Storing results (memoisation) brings it down to linear. See [[Big-O Notation]].

- [ ] Write a recursive function that sums a list

@@ Data Structures/Arrays
An **array** stores elements in one contiguous block of memory, so element `i` sits at a fixed offset from the start.

| Operation | Cost |
| --- | --- |
| Access by index | O(1) |
| Search (unsorted) | O(n) |
| Insert / delete at end | O(1) amortised |
| Insert / delete in the middle | O(n) |

## Dynamic arrays
Python lists and Java `ArrayList` grow by allocating a bigger block (often about double) and copying. Copying is O(n), but it happens so rarely that appending is O(1) *on average*: that's what "amortised" means.

@@ Data Structures/Linked Lists
A **linked list** is a chain of nodes. Each node holds a value and a pointer to the next node.

```python
class Node:
    def __init__(self, value, next=None):
        self.value = value
        self.next = next
```

| Operation | Cost |
| --- | --- |
| Access by index | O(n) |
| Insert / delete at head | O(1) |
| Insert after a known node | O(1) |
| Search | O(n) |

- **Singly linked:** each node points forward only.
- **Doubly linked:** nodes point both ways, so you can delete a node in O(1) when you hold a reference to it.

@@ Data Structures/Stacks and Queues
## Stack: last in, first out (LIFO)
- `push` adds to the top, `pop` removes from the top. Both O(1).
- Used for: the function **call stack** ([[Recursion]]), undo history, matching brackets, depth-first search.

## Queue: first in, first out (FIFO)
- `enqueue` adds to the back, `dequeue` removes from the front. Both O(1) with the right implementation.
- Used for: print jobs, task scheduling, breadth-first search ([[Graph Traversal]]).

```python
from collections import deque
q = deque()
q.append("a")      # enqueue
q.popleft()        # dequeue -> "a"
```

> [!warning]
> `list.pop(0)` in Python is O(n) because every other element shifts. Use `deque` for queues.

@@ Data Structures/Hash Tables
A **hash table** maps keys to values. A **hash function** turns each key into an index in an underlying array.

| Operation | Average | Worst |
| --- | --- | --- |
| Lookup | O(1) | O(n) |
| Insert | O(1) | O(n) |
| Delete | O(1) | O(n) |

## Collisions
Two keys can hash to the same index. Two common fixes:
- **Chaining:** each slot holds a small list of entries.
- **Open addressing:** on a collision, probe for the next free slot.

The **load factor** (entries ÷ slots) is kept low by resizing, which keeps operations close to O(1).

> [!example] You use these all the time
> Python's `dict` is a hash table, and `set` is a hash set, which is why `x in my_set` is fast. A Python set behaves like a maths set from [[Set Notation]]: no order, no duplicates.

@@ Data Structures/Trees
A **tree** is a hierarchy of nodes: one **root**, and every other node has exactly one **parent**. Nodes with no children are **leaves**. The **height** is the longest path from root to a leaf.

## Binary search trees
Each node has at most two children, and for every node:
- everything in the left subtree is smaller
- everything in the right subtree is larger

| Operation | Balanced | Worst (a "stick") |
| --- | --- | --- |
| Search | O(log n) | O(n) |
| Insert | O(log n) | O(n) |

Self-balancing trees (AVL, red–black) keep the height near log₂ n.

## Traversals
- **In-order** (left, node, right) visits a BST's values in sorted order.
- **Pre-order** and **post-order** are natural fits for [[Recursion]].

@@ Data Structures/Graphs
A **graph** `G = (V, E)` is a set of vertices V and a set of edges E. In a directed graph, `E ⊆ V × V`, which makes E a relation on V ([[Relations]]).

- **Undirected:** edges go both ways (friendships)
- **Directed:** edges have a direction (follows, links between web pages)
- **Weighted:** edges carry a cost (road distances)

## Storing a graph
| | Adjacency list | Adjacency matrix |
| --- | --- | --- |
| Space | O(V + E) | O(V²) |
| Is there an edge u→v? | O(degree of u) | O(1) |
| Best for | sparse graphs | dense graphs |

> [!tip]
> The graph view in this vault is a graph: notes are vertices and links are edges.

@@ Algorithms/Big-O Notation
**Big-O** describes how an algorithm's running time (or memory) grows as the input size n grows.

> [!note] Definition
> `f(n) = O(g(n))` if there are constants `c > 0` and `n₀` such that `f(n) ≤ c · g(n)` for every `n ≥ n₀`.

## Common classes, fastest first
| Class | Name | Example |
| --- | --- | --- |
| O(1) | constant | array index |
| O(log n) | logarithmic | [[Binary Search]] |
| O(n) | linear | scanning a list |
| O(n log n) | linearithmic | merge sort |
| O(n²) | quadratic | bubble sort |
| O(2ⁿ) | exponential | naive Fibonacci |

## Simplifying
- Drop constant factors: `3n + 10` is `O(n)`.
- Keep the dominant term: `n² + 500n` is `O(n²)`.
- Nested loops over the same input usually multiply: two levels give `O(n²)`.

@@ Algorithms/Binary Search
Find a value in a **sorted** array by repeatedly halving the search range.

```python
def binary_search(xs, target):
    lo, hi = 0, len(xs) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if xs[mid] == target:
            return mid
        if xs[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1
```

Each step throws away half the remaining elements, so it takes at most about log₂ n steps: **O(log n)**. For a million elements, that's around 20 comparisons.

> [!warning]
> It only works on sorted data. Sorting first costs O(n log n), so it pays off when you search many times.

@@ Algorithms/Sorting Algorithms
| Algorithm | Best | Average | Worst | Stable? |
| --- | --- | --- | --- | --- |
| Bubble sort | O(n) | O(n²) | O(n²) | yes |
| Insertion sort | O(n) | O(n²) | O(n²) | yes |
| Merge sort | O(n log n) | O(n log n) | O(n log n) | yes |
| Quicksort | O(n log n) | O(n log n) | O(n²) | no |

- **Stable** means equal elements keep their original order.
- **Insertion sort** is fast on small or nearly sorted lists.
- **Merge sort** splits, sorts each half recursively, then merges: a classic use of [[Recursion]].
- **Quicksort** picks a pivot and partitions. A bad pivot on already-sorted data gives the O(n²) worst case.

> [!note] A hard limit
> Any sort that only compares elements needs Ω(n log n) comparisons in the worst case.

@@ Algorithms/Graph Traversal
Two ways to visit every reachable vertex in a [[Graphs|graph]].

## Breadth-first search (BFS)
Explores level by level using a **queue**. In an unweighted graph it finds the shortest path from the start.

```python
from collections import deque
def bfs(graph, start):
    seen, q = {start}, deque([start])
    while q:
        v = q.popleft()
        for w in graph[v]:
            if w not in seen:
                seen.add(w)
                q.append(w)
    return seen
```

## Depth-first search (DFS)
Goes as deep as possible before backtracking, using a **stack** or [[Recursion]]. Good for cycle detection and topological sorting.

Both take **O(V + E)** with an adjacency list.

        } else if (e && e.code === "invalid_argument") {

/* ---------- markdown ---------- */
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/!\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, t, a) => embedHtml(unesc(t.trim()), a));
  s = s.replace(/\[\[([^\]|#]+)(#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, t, h, a) => {
    const raw = unesc(t.trim()); const n = findByTitle(raw);
    return `<a class="internal-link${n ? "" : " unresolved"}" href="#" data-target="${esc(raw)}">${a || t.trim()}</a>`;
  });
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a class="external-link" href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/==([^=]+)==/g, "<mark>$1</mark>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/(^|\s)#([A-Za-z][\w/-]*)/g, '$1<a class="tag" href="#" data-tag="$2">#$2</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => "<code>" + esc(codes[+i]) + "</code>");
  return s;
}
function embedHtml(title, alias) {
  const n = findByTitle(title);
  if (n && n.kind === "file" && n.url && /^image\//.test(n.mime)) return `<img src="${esc(n.url)}" alt="${esc(alias || n.title)}">`;
  return `<a class="internal-link embed-chip${n ? "" : " unresolved"}" href="#" data-target="${esc(title)}">${ico(n && n.kind === "file" ? "clip" : "file", "sm")}${esc(alias || title)}</a>`;
}
const CALLOUT_ICON = { tip: "bulb", success: "check", warning: "alert", caution: "alert", example: "list", question: "help" };
function renderMd(src, base = 0) {
  const lines = src.replace(/\r/g, "").split("\n");
  let html = "", i = 0;
  const isStart = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|\|)/.test(l) || /^(-{3,}|\*{3,})\s*$/.test(l);
  if (base === 0 && lines[0] === "---") {
    const end = lines.indexOf("---", 1);
    if (end > 0) {
      const rows = lines.slice(1, end).map(l => { const k = l.indexOf(":"); return k > 0 ? `<dt>${esc(l.slice(0, k).trim())}</dt><dd>${esc(l.slice(k + 1).trim())}</dd>` : ""; }).join("");
      if (rows) html += `<dl class="props">${rows}</dl>`;
      i = end + 1;
    }
  }
  let h = 0;
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const lv = m[1].length; html += `<h${lv} data-h="${h++}">${inline(m[2])}</h${lv}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)) { html += "<hr>"; i++; continue; }
    if (/^>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      const cm = buf[0].match(/^\[!(\w+)\][-+]?\s*(.*)$/);
      if (cm) {
        const type = cm[1].toLowerCase();
        const title = cm[2] || type.charAt(0).toUpperCase() + type.slice(1);
        html += `<div class="callout" data-callout="${esc(type)}"><div class="callout-title">${ico(CALLOUT_ICON[type] || "info", "sm")}${inline(title)}</div><div class="callout-content">${renderMd(buf.slice(1).join("\n"), -1)}</div></div>`;
      } else html += `<blockquote>${renderMd(buf.join("\n"), -1)}</blockquote>`;
      continue;
    }
    if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      html += `<div class="table-wrap"><table><thead><tr>${cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const stack = [];
      while (i < lines.length) {
        const lm = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (!lm) break;
        const ind = lm[1].replace(/\t/g, "    ").length;
        const type = /\d/.test(lm[2]) ? "ol" : "ul";
        while (stack.length && ind < stack[stack.length - 1].ind) html += `</li></${stack.pop().type}>`;
        if (!stack.length || ind > stack[stack.length - 1].ind) { html += `<${type}>`; stack.push({ type, ind }); }
        else html += "</li>";
        const t = lm[3].match(/^\[( |x|X)\]\s+(.*)$/);
        if (t) {
          const done = t[1] !== " ";
          html += `<li class="task${done ? " done" : ""}"><input type="checkbox" aria-label="Done"${done ? " checked" : ""}${base >= 0 ? ` data-line="${i + base}"` : " disabled"}>${inline(t[2])}`;
        } else html += `<li>${inline(lm[3])}`;
        i++;
      }
      while (stack.length) html += `</li></${stack.pop().type}>`;
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !(buf.length && isStart(lines[i]))) buf.push(lines[i++]);
    html += `<p>${buf.map(inline).join("<br>")}</p>`;
  }
  return html;
}
function headingsOf(body) {
  const out = []; let inCode = false;
  for (const l of body.split("\n")) {
    if (/^```/.test(l)) { inCode = !inCode; continue; }
    if (inCode) continue;
    const m = l.match(/^(#{1,6})\s+(.*)$/);
    if (m) out.push({ lv: m[1].length, text: m[2].replace(/[*_`=\[\]]/g, "") });
  }
  return out;
}

/* ---------- folders & tree ---------- */
function allFolders() {
  const set = new Set();
  const add = f => { if (!f) return; const parts = f.split("/"); for (let k = 1; k <= parts.length; k++) set.add(parts.slice(0, k).join("/")); };
  allNotes().forEach(n => add(n.folder));
  state.userFolders.forEach(add);
  return set;
}
function folderSortKey(path) {
  if (folderOrder.has(path)) return folderOrder.get(path);
  let min = Infinity;
  allNotes().forEach(n => { if ((n.folder === path || n.folder.startsWith(path + "/")) && typeof n.order === "number") min = Math.min(min, n.order); });
  return min === Infinity ? 100000 : min;
}
function progressOf(path) {
  const ns = allNotes().filter(n => n.status && (n.folder === path || n.folder.startsWith(path + "/") || path === null));
  const c = { total: ns.length, mastered: 0, learning: 0 };
  ns.forEach(n => { if (n.status === "mastered") c.mastered++; else if (n.status === "learning") c.learning++; });
  return c;
}
function sortNotes(list, folder) {
  const hub = folder ? folder.split("/").pop() : null;
  return list.sort((a, b) => {
    if (hub) { if (a.title === hub) return -1; if (b.title === hub) return 1; }
    if (a.kind !== b.kind) return a.kind === "note" ? -1 : 1;
    const oa = typeof a.order === "number" ? a.order : 9999, ob = typeof b.order === "number" ? b.order : 9999;
    return oa - ob || a.title.localeCompare(b.title);
  });
}
function treeHtml(path, depth) {
  const folders = [...allFolders()].filter(f => (path ? f.startsWith(path + "/") && f.split("/").length === path.split("/").length + 1 : !f.includes("/")));
  folders.sort((a, b) => folderSortKey(a) - folderSortKey(b) || a.localeCompare(b));
  let html = "";
  for (const f of folders) {
    const open = !state.collapsed.has(f);
    const p = progressOf(f);
    html += `<div class="tree-folder${open ? " open" : ""}" data-folder="${esc(f)}">
      <div class="row" data-folder-row="${esc(f)}" tabindex="0" role="treeitem" aria-expanded="${open}">${ico("chev", "sm chev")}<span class="name">${esc(f.split("/").pop())}</span>${p.total ? `<span class="prog" title="${p.mastered} of ${p.total} concepts mastered">${p.mastered}/${p.total}</span>` : ""}</div>
      <div class="tree-children">${treeHtml(f, depth + 1)}</div></div>`;
  }
  const notes = sortNotes(allNotes().filter(n => (n.folder || "") === (path || "")), path);
  for (const n of notes) {
    const ext = n.kind === "file" ? (n.title.match(/\.([a-z0-9]+)$/i) || [, "file"])[1] : "";
    html += `<div class="tree-note${state.active === n.id ? " active" : ""}" data-id="${esc(n.id)}" draggable="true" tabindex="0" role="treeitem"><span class="name">${esc(n.kind === "file" ? n.title.replace(/\.[^.]+$/, "") : n.title)}</span>${n.kind === "file" ? `<span class="ext">${esc(ext)}</span>` : ""}${n.status ? `<span class="dot ${n.status}" title="${STATUS[n.status]}"></span>` : ""}</div>`;
  }
  return html;
}

/* ---------- rendering ---------- */
const view = { key: null };
const SPECIAL = new Set(["graph", "home"]);

function renderLeft() {

  $("#left-title").textContent = state.left === "files" ? "Modules" : "Search";

  } else {
    let box = $("#search-in", body);
    if (!box) {
      body.innerHTML = `<label class="search-box">${ico("search", "sm")}<input id="search-in" placeholder="Search notes" autocomplete="off"></label><div id="search-res"></div>`;
      box = $("#search-in", body);
      box.value = state.query;
      box.addEventListener("input", () => { state.query = box.value; renderSearch(); });
    }
    renderSearch();
  }
  const p = progressOf(null);
  const pct = x => p.total ? (x / p.total * 100) : 0;
  $("#vault-foot").innerHTML = `<div class="vn">Learning Vault<span>${p.mastered} of ${p.total} mastered</span></div>
    <div class="bar" role="img" aria-label="${p.mastered} mastered, ${p.learning} in progress, out of ${p.total}"><i class="b-done" style="width:${pct(p.mastered)}%"></i><i class="b-learn" style="width:${pct(p.learning)}%"></i></div>`;
}
function renderSearch() {
  const out = $("#search-res"); if (!out) return;
  const q = state.query.trim().toLowerCase();
  if (!q) { out.innerHTML = `<div class="empty-note">Type to search titles and note text. Try <b>#sets</b> or <b>bijection</b>.</div>`; return; }
  const res = [];
  for (const n of allNotes()) {
    const inTitle = n.title.toLowerCase().includes(q);
    const idx = n.body.toLowerCase().indexOf(q);
    if (!inTitle && idx < 0) continue;
    let snip = "";
    if (idx >= 0) {
      const s = Math.max(0, idx - 40), raw = n.body.slice(s, idx + q.length + 60).replace(/\n/g, " ");
      const k = idx - s;

    }
    res.push({ n, score: inTitle ? 0 : 1, snip });
  }
  res.sort((a, b) => a.score - b.score || a.n.title.localeCompare(b.n.title));
  out.innerHTML = res.length ? `<div class="empty-note" style="padding:0 8px 6px">${res.length} result${res.length > 1 ? "s" : ""}</div>` + res.slice(0, 80).map(r => `<div class="result" data-id="${esc(r.n.id)}" tabindex="0"><div class="rt">${esc(r.n.title)}</div>${r.snip ? `<div class="rs">${r.snip}</div>` : ""}</div>`).join("") : `<div class="empty-note">No notes match “${esc(state.query)}”.</div>`;
}

function renderView(force) {
  const box = $("#view"); const n = activeNote();
  if (state.active !== "home") Constellation.stop();
  if (state.active === "home") {
    Graph.unmount();

  }

function fileViewHtml(n) {

function bindFileView(n) {

  if (!state.tabs.includes(id)) {
    const k = state.tabs.indexOf(state.active);

}

  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dialog"><h3 id="dlg-t">${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ""}${input !== undefined ? `<input id="dlg-in" value="${esc(input)}" placeholder="${esc(placeholder)}" autocomplete="off">` : ""}<div class="btns"><button class="btn" data-r="0">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-r="1">${esc(confirm)}</button></div></div></div>`;
    document.body.appendChild(bg);
    const inp = $("#dlg-in", bg);
    const done = ok => { bg.remove(); resolve(ok ? (inp ? inp.value.trim() : true) : (inp ? null : false)); };
    bg.addEventListener("click", e => { if (e.target === bg) done(false); const b = e.target.closest("[data-r]"); if (b) done(b.dataset.r === "1"); });
    bg.addEventListener("keydown", e => { if (e.key === "Escape") done(false); if (e.key === "Enter") { e.preventDefault(); done(true); } });
    (inp || bg.querySelector('[data-r="1"]')).focus(); if (inp) inp.select();
  });
}
let ctxEl = null;
function closeCtx() { if (ctxEl) ctxEl.remove(); ctxEl = null; }
function showCtx(x, y, items) {
  closeCtx(); ctxEl = document.createElement("div"); ctxEl.className = "ctx"; ctxEl.setAttribute("role", "menu");
  ctxEl.innerHTML = items.map((it, k) => it === "-" ? "<hr>" : `<button role="menuitem" data-k="${k}" class="${it.danger ? "danger" : ""}">${ico(it.icon, "sm")}${esc(it.label)}</button>`).join("");
  document.body.appendChild(ctxEl);
  const r = ctxEl.getBoundingClientRect();
  ctxEl.style.left = Math.min(x, innerWidth - r.width - 8) + "px"; ctxEl.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  ctxEl.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; const it = items[+b.dataset.k]; closeCtx(); it.run(); });
  ctxEl.querySelector("button").focus();
}
document.addEventListener("click", e => { if (ctxEl && !ctxEl.contains(e.target)) closeCtx(); });
document.addEventListener("scroll", closeCtx, true);

function openSwitcher() {
  if ($(".modal-bg")) return;
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Quick switcher"><input class="q" id="sw-q" placeholder="Find or create a note…" autocomplete="off"><div class="list" id="sw-list" role="listbox"></div><div class="foot"><span><span class="kbd">↑↓</span> to move</span><span><span class="kbd">↵</span> to open</span><span><span class="kbd">esc</span> to close</span></div></div>`;
  document.body.appendChild(bg);
  const q = $("#sw-q", bg), list = $("#sw-list", bg); let sel = 0, items = [];
  const draw = () => {
    const s = q.value.trim().toLowerCase();
    items = allNotes().filter(n => !s || n.title.toLowerCase().includes(s) || (n.folder || "").toLowerCase().includes(s))
      .sort((a, b) => (s ? (a.title.toLowerCase().startsWith(s) ? 0 : 1) - (b.title.toLowerCase().startsWith(s) ? 0 : 1) : 0) || (b.updated || 0) - (a.updated || 0) || a.title.localeCompare(b.title)).slice(0, 40).map(n => ({ n }));
    if (s && !findByTitle(q.value.trim())) items.push({ create: q.value.trim() });
    sel = Math.min(sel, items.length - 1); if (sel < 0) sel = 0;
    list.innerHTML = items.map((it, k) => `<div class="opt${k === sel ? " sel" : ""}" data-k="${k}" role="option" aria-selected="${k === sel}">${it.n ? `<span>${esc(it.n.title)}</span><small>${esc(it.n.folder || "")}</small>` : `<span>Create note “${esc(it.create)}”</span><small>in My Notes</small>`}</div>`).join("") || `<div class="empty-note">No notes yet.</div>`;
    const el = list.querySelector(".sel"); if (el) el.scrollIntoView({ block: "nearest" });
  };
  const pick = k => { const it = items[k]; bg.remove(); if (!it) return; if (it.n) openNote(it.n.id); else createNote("My Notes", it.create); };
  q.addEventListener("input", () => { sel = 0; draw(); });
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(items.length, 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + items.length) % Math.max(items.length, 1); draw(); }
    else if (e.key === "Enter") { e.preventDefault(); pick(sel); }
    else if (e.key === "Escape") bg.remove();
  });
  list.addEventListener("click", e => { const o = e.target.closest("[data-k]"); if (o) pick(+o.dataset.k); });
  bg.addEventListener("mousedown", e => { if (e.target === bg) bg.remove(); });
  draw(); q.focus();
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 4200);
}

/* ---------- events ---------- */
function setIcons() {
  const set = (id, n) => { $(id).innerHTML = ico(n); };
  set("#rb-left", "panelL"); set("#rb-switch", "switcher"); set("#rb-graph", "graph"); set("#rb-new", "edit"); set("#rb-import", "upload");
  set("#rb-home", "home"); set("#rb-right", "panelR"); set("#lt-files", "folder"); set("#lt-search", "search"); set("#lt-newnote", "filePlus"); set("#lt-newfolder", "folderPlus");
}
function newNoteHere() { const n = activeNote(); createNote(n ? n.folder || "My Notes" : "My Notes"); }
function home() { openNote("home"); }
function bindUi() {
  $("#rb-left").onclick = () => { $("#left").hidden = !$("#left").hidden; };
  $("#rb-right").onclick = () => { $("#right").hidden = !$("#right").hidden; };
  $("#rb-switch").onclick = openSwitcher;
  $("#rb-graph").onclick = () => openNote("graph", { newTab: true });
  $("#rb-new").onclick = newNoteHere;
  $("#rb-import").onclick = () => pickFiles(null);
  $("#rb-home").onclick = home;
  $("#lt-files").onclick = () => { state.left = "files"; $("#left-body").innerHTML = ""; renderLeft(); };
  $("#lt-search").onclick = () => { state.left = "search"; $("#left-body").innerHTML = ""; renderLeft(); $("#search-in").focus(); };
  $("#lt-newnote").onclick = newNoteHere;
  $("#lt-newfolder").onclick = () => newFolder("");

  const left = $("#left-body");
  left.addEventListener("click", e => {
    const row = e.target.closest("[data-folder-row]");
    if (row) { const f = row.dataset.folderRow; state.collapsed.has(f) ? state.collapsed.delete(f) : state.collapsed.add(f); saveCollapsed(); renderLeft(); return; }
    const it = e.target.closest("[data-id]");
    if (it) openNote(it.dataset.id, { newTab: e.ctrlKey || e.metaKey });
  });
  left.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const t = e.target.closest("[data-folder-row],[data-id]"); if (t) { e.preventDefault(); t.click(); } } });
  left.addEventListener("contextmenu", e => {
    const it = e.target.closest(".tree-note"); const fr = e.target.closest("[data-folder-row]");
    if (it) {
      e.preventDefault(); const n = state.notes.get(it.dataset.id); if (!n) return;
      showCtx(e.clientX, e.clientY, [
        { icon: "file", label: "Open in new tab", run: () => openNote(n.id, { newTab: true }) },
        { icon: "edit", label: "Rename", run: async () => { const t = await dialog({ title: "Rename", input: n.title, confirm: "Rename" }); if (t) renameNote(n, t); } },
        ...(n.kind === "note" ? [{ icon: "check", label: n.status ? "Stop tracking progress" : "Track as a concept", run: () => setStatus(n, n.status ? "none" : "new") }] : []),
        "-", { icon: "trash", label: "Delete", danger: true, run: () => deleteNote(n) }
      ]);
    } else if (fr) {
      e.preventDefault(); const f = fr.dataset.folderRow;
      showCtx(e.clientX, e.clientY, [
        { icon: "filePlus", label: "New note here", run: () => createNote(f) },
        { icon: "folderPlus", label: "New folder inside", run: () => newFolder(f) },
        { icon: "upload", label: "Import files here", run: () => pickFiles(f) },
        { icon: "edit", label: "Rename folder", run: () => renameFolder(f) },
        "-", { icon: "trash", label: "Delete folder", danger: true, run: () => deleteFolder(f) }
      ]);
    }
  });
  left.addEventListener("dragstart", e => {
    const it = e.target.closest(".tree-note"); if (!it) return;
    e.dataTransfer.setData(INTERNAL, it.dataset.id); e.dataTransfer.effectAllowed = "move";
  });

  $("#tabbar").addEventListener("click", e => {
    const x = e.target.closest("[data-close]"); if (x) { e.stopPropagation(); closeTab(x.dataset.close); return; }
    if (e.target.closest("#tab-add")) { newNoteHere(); return; }
    const t = e.target.closest("[data-tab]"); if (t && t.dataset.tab !== state.active) { state.active = t.dataset.tab; view.key = null; renderAll(); }
  });
  $("#tabbar").addEventListener("auxclick", e => { const t = e.target.closest("[data-tab]"); if (t && e.button === 1) closeTab(t.dataset.tab); });

  $("#view-header").addEventListener("click", e => {
    const n = activeNote();
    if (e.target.closest("#mode-btn")) toggleMode();
    if (e.target.closest("#status-pill") && n) setStatus(n, STATUS_NEXT[n.status] || "new");
  });

  $("#view").addEventListener("click", e => {
    const a = e.target.closest("a.internal-link"); if (a) { e.preventDefault(); openLink(a.dataset.target, e.ctrlKey || e.metaKey); return; }
    const tg = e.target.closest("a.tag"); if (tg) { e.preventDefault(); state.left = "search"; state.query = "#" + tg.dataset.tag; $("#left").hidden = false; $("#left-body").innerHTML = ""; renderLeft(); return; }
    const op = e.target.closest("[data-open]"); if (op) { openNote(op.dataset.open, { newTab: true }); return; }
    const act = e.target.closest("[data-act]");
    if (act) ({ new: newNoteHere, switch: openSwitcher, graph: () => openNote("graph", { newTab: true }), import: () => pickFiles(null), home, pick: () => pickFiles("My Notes"), folder: () => newFolder(""), start: () => { const s = findByTitle("Start Here"); if (s) openNote(s.id, { newTab: true }); } })[act.dataset.act]();
  });
  $("#view").addEventListener("dblclick", e => {
    const n = activeNote(); if (!n || n.kind !== "note" || (state.modes[n.id] || "read") !== "read") return;
    if (e.target.closest("a,input,button")) return;
    if (e.target.closest("#md")) toggleMode();
  });

  $("#right-body").addEventListener("click", e => {
    const n = activeNote();
    const st = e.target.closest("[data-status]"); if (st && n) { setStatus(n, st.dataset.status); return; }
    const li = e.target.closest("[data-id]"); if (li) { openNote(li.dataset.id); return; }
    const cr = e.target.closest("[data-create]"); if (cr) { createNote(n ? n.folder : "My Notes", cr.dataset.create); return; }
    const oh = e.target.closest("[data-h]");
    if (oh && n) {
      if ((state.modes[n.id] || "read") === "edit") toggleMode();
      const h = document.querySelector(`#md [data-h="${oh.dataset.h}"]`); if (h) h.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  $("#right-body").addEventListener("keydown", e => { if (e.key === "Enter") { const t = e.target.closest("[data-id],[data-create]"); if (t) t.click(); } });
  $("#left-body").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".result")) e.target.click(); });

  document.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
    if (mod && (k === "p" || k === "k" || k === "o")) { e.preventDefault(); openSwitcher(); }
    else if (mod && k === "e") { e.preventDefault(); toggleMode(); }
    else if (mod && k === "g") { e.preventDefault(); openNote("graph", { newTab: true }); }
    else if (e.altKey && k === "n") { e.preventDefault(); newNoteHere(); }
    else if (e.altKey && k === "w" && state.active) { e.preventDefault(); closeTab(state.active); }
    else if (e.key === "Escape") closeCtx();
  });
  const retheme = () => { if (state.active === "graph") Graph.rebuild(); if (state.active === "home") { Constellation.readColors(); Constellation.draw(performance.now()); } };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  addEventListener("beforeunload", () => { for (const id of [...Store.dirty.keys()]) { clearTimeout(Store.timers.get(id)); Store.flush(id); } });
}

/* ---------- start ---------- */
parseSeed();
setIcons();
bindUi();
if (innerWidth <= 1000) $("#right").hidden = true;
if (innerWidth <= 700) $("#left").hidden = true;
state.tabs = ["home"]; state.active = "home";
renderAll();
Store.init();
})();
</script>
</body>
</html>
